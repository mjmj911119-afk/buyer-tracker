<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은별이방 쿠폰 기록</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px 14px 40px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:#5b3b4b;
  min-height:100vh;
  background:
    radial-gradient(circle at top left,#ffe1ef 0,transparent 35%),
    radial-gradient(circle at top right,#eee3ff 0,transparent 32%),
    linear-gradient(180deg,#fff9fc 0%,#fff0f6 55%,#f8f2ff 100%);
}

.container{
  max-width:1000px;
  margin:auto;
}

.hero{
  position:relative;
  overflow:hidden;
  padding:27px 22px;
  margin-bottom:18px;
  border-radius:27px;
  color:white;
  background:linear-gradient(135deg,#ff91bb 0%,#f7a4ca 48%,#bd9cff 100%);
  box-shadow:0 14px 35px rgba(226,115,166,.24);
}

.hero:before{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  right:-45px;
  top:-70px;
}

.hero:after{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  border-radius:50%;
  background:rgba(255,255,255,.13);
  left:-25px;
  bottom:-40px;
}

.hero h1{
  position:relative;
  margin:0 0 7px;
  font-size:27px;
  z-index:1;
}

.hero p{
  position:relative;
  margin:0;
  font-size:14px;
  opacity:.95;
  z-index:1;
}

.card{
  padding:18px;
  margin-bottom:16px;
  border-radius:22px;
  background:rgba(255,255,255,.94);
  border:1px solid #f5d6e4;
  box-shadow:0 10px 28px rgba(212,120,161,.10);
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr 120px 150px;
  gap:10px;
}

input{
  width:100%;
  padding:14px 15px;
  border:1.5px solid #f2cede;
  border-radius:14px;
  background:#fffafd;
  color:#654455;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#f08fba;
  box-shadow:0 0 0 4px rgba(240,143,186,.15);
}

button{
  cursor:pointer;
}

.add{
  border:0;
  border-radius:14px;
  color:white;
  font-size:16px;
  font-weight:800;
  background:linear-gradient(135deg,#ff7ead,#ef8fc6 55%,#ad91f5);
  box-shadow:0 8px 18px rgba(225,105,165,.24);
}

.add:active{
  transform:scale(.98);
}

.tip{
  margin-top:10px;
  color:#ad8296;
  font-size:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}

.stat{
  padding:15px;
  border-radius:18px;
  text-align:center;
  font-weight:700;
}

.stat:nth-child(1){
  background:linear-gradient(135deg,#ffe0ed,#ffcfe2);
}

.stat:nth-child(2){
  background:linear-gradient(135deg,#ffe7f5,#f6d7ee);
}

.stat:nth-child(3){
  background:linear-gradient(135deg,#eee5ff,#ddd2ff);
}

.stat span{
  display:block;
  margin-bottom:5px;
  font-size:12px;
  opacity:.65;
}

.stat strong{
  font-size:22px;
}

.section-title{
  margin-bottom:12px;
  font-size:17px;
}

.tablebox{
  overflow-x:auto;
  border-radius:16px;
}

table{
  width:100%;
  min-width:600px;
  border-collapse:collapse;
  background:white;
}

th,td{
  padding:12px 10px;
  border-bottom:1px solid #f5e8ee;
  text-align:center;
}

th{
  background:linear-gradient(180deg,#ffedf5,#fff8fb);
  color:#b65d83;
  font-size:14px;
}

tr:nth-child(even) td{
  background:#fffcfd;
}

.qty{
  width:70px;
  padding:9px;
  text-align:center;
  border-radius:10px;
  border:1px solid #f1d5e1;
  background:#fffafd;
}

.delete{
  padding:9px 12px;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,#ffd9e7,#ffe8f0);
  color:#d35d83;
  font-weight:800;
}

.reset-wrap{
  text-align:right;
}

.reset{
  padding:11px 14px;
  border:0;
  border-radius:12px;
  background:#f4eaf0;
  color:#a1778b;
  font-weight:700;
}

.empty{
  padding:38px 20px;
  border-radius:14px;
  text-align:center;
  color:#b38a9e;
  background:linear-gradient(180deg,#fffafd,#fff5f9);
}

@media(max-width:760px){
  .form{
    grid-template-columns:1fr 1fr;
  }

  .add{
    grid-column:1/-1;
    min-height:48px;
  }

  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  .stat{
    padding:12px 5px;
  }

  .stat strong{
    font-size:18px;
  }

  .hero h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="hero">
  <h1>🎀 은별이방 쿠폰 기록</h1>
  <p>쿠폰 구매 기록을 쉽고 예쁘게 관리해요 ♡</p>
</div>

<div class="card">
  <div class="form">

    <input id="buyer" placeholder="구매한 이름">

    <input id="product" placeholder="구매한 항목">

    <input
      id="count"
      type="number"
      min="1"
      value="1"
      placeholder="개수">

    <button id="addButton" class="add">
      ＋ 기록 추가
    </button>

  </div>

  <div class="tip">
    같은 이름 + 같은 항목을 추가하면 개수가 자동으로 합산돼요.
  </div>
</div>

<div class="stats">

  <div class="stat">
    <span>구매자</span>
    <strong id="peopleCount">0명</strong>
  </div>

  <div class="stat">
    <span>쿠폰 항목</span>
    <strong id="itemCount">0개</strong>
  </div>

  <div class="stat">
    <span>전체 수량</span>
    <strong id="totalCount">0개</strong>
  </div>

</div>

<div class="card">

  <div class="section-title">
    <b>🩷 쿠폰 기록 현황</b>
  </div>

  <div id="tableArea" class="tablebox"></div>

</div>

<div class="reset-wrap">
  <button id="resetButton" class="reset">
    전체 기록 삭제
  </button>
</div>

</div>

<script>

var records={
  items:[],
  people:{}
};

try{
  var saved=localStorage.getItem("buyerTracker");

  if(saved){
    records=JSON.parse(saved);
  }
}catch(e){}

function save(){
  localStorage.setItem(
    "buyerTracker",
    JSON.stringify(records)
  );
}

function addRecord(){

  var buyer=
    document.getElementById("buyer")
    .value.trim();

  var product=
    document.getElementById("product")
    .value.trim();

  var count=
    parseInt(
      document.getElementById("count")
      .value
    );

  if(buyer===""){
    alert("구매한 이름을 입력해주세요.");
    return;
  }

  if(product===""){
    alert("구매한 항목을 입력해주세요.");
    return;
  }

  if(!count||count<1){
    alert("개수를 입력해주세요.");
    return;
  }

  if(records.items.indexOf(product)===-1){
    records.items.push(product);
  }

  if(!records.people[buyer]){
    records.people[buyer]={};
  }

  if(!records.people[buyer][product]){
    records.people[buyer][product]=0;
  }

  records.people[buyer][product]+=count;

  save();

  document.getElementById("buyer").value="";
  document.getElementById("product").value="";
  document.getElementById("count").value="1";

  drawTable();
}

function changeQty(buyer,product,value){

  var number=parseInt(value);

  if(isNaN(number)||number<0){
    number=0;
  }

  records.people[buyer][product]=number;

  save();
  drawTable();
}

function deleteBuyer(buyer){

  if(confirm(buyer+"님의 기록을 삭제할까요?")){

    delete records.people[buyer];

    save();
    drawTable();
  }
}

function updateStats(){

  var buyers=
    Object.keys(records.people);

  document.getElementById("peopleCount")
    .textContent=buyers.length+"명";

  document.getElementById("itemCount")
    .textContent=records.items.length+"개";

  var grandTotal=0;

  buyers.forEach(function(buyer){

    records.items.forEach(function(product){

      grandTotal+=
        records.people[buyer][product]||0;

    });

  });

  document.getElementById("totalCount")
    .textContent=grandTotal+"개";
}

function drawTable(){

  var area=
    document.getElementById("tableArea");

  var buyers=
    Object.keys(records.people);

  updateStats();

  if(buyers.length===0){

    area.innerHTML=
      '<div class="empty">'+
      '🎀 아직 쿠폰 기록이 없어요.<br>'+
      '위에서 이름, 항목, 개수를 입력해주세요!'+
      '</div>';

    return;
  }

  var table=
    document.createElement("table");

  var thead=
    document.createElement("thead");

  var header=
    document.createElement("tr");

  var nameHeader=
    document.createElement("th");

  nameHeader.textContent="구매한 이름";

  header.appendChild(nameHeader);

  records.items.forEach(function(product){

    var th=
      document.createElement("th");

    th.textContent=product;

    header.appendChild(th);

  });

  var totalHeader=
    document.createElement("th");

  totalHeader.textContent="총 개수";

  header.appendChild(totalHeader);

  var manageHeader=
    document.createElement("th");

  manageHeader.textContent="관리";

  header.appendChild(manageHeader);

  thead.appendChild(header);
  table.appendChild(thead);

  var tbody=
    document.createElement("tbody");

  buyers.forEach(function(buyer){

    var row=
      document.createElement("tr");

    var name=
      document.createElement("td");

    name.textContent=buyer;

    row.appendChild(name);

    var total=0;

    records.items.forEach(function(product){

      var td=
        document.createElement("td");

      var input=
        document.createElement("input");

      input.type="number";
      input.min="0";
      input.className="qty";

      var quantity=
        records.people[buyer][product]||0;

      input.value=quantity;

      total+=quantity;

      input.onchange=function(){

        changeQty(
          buyer,
          product,
          this.value
        );

      };

      td.appendChild(input);
      row.appendChild(td);

    });

    var totalCell=
      document.createElement("td");

    totalCell.innerHTML="<b>"+total+"</b>";

    row.appendChild(totalCell);

    var manage=
      document.createElement("td");

    var deleteButton=
      document.createElement("button");

    deleteButton.textContent="삭제";
    deleteButton.className="delete";

    deleteButton.onclick=function(){
      deleteBuyer(buyer);
    };

    manage.appendChild(deleteButton);
    row.appendChild(manage);

    tbody.appendChild(row);

  });

  table.appendChild(tbody);

  area.innerHTML="";
  area.appendChild(table);
}

document
.getElementById("addButton")
.onclick=addRecord;

document
.getElementById("resetButton")
.onclick=function(){

  if(confirm("모든 쿠폰 기록을 삭제할까요?")){

    records={
      items:[],
      people:{}
    };

    save();
    drawTable();
  }
};

drawTable();

</script>

</body>
</html>
