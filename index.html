<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은별이방 쿠폰 기록</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px 14px 40px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:#5b3b4b;
  min-height:100vh;
  background:
    radial-gradient(circle at top left,#ffe2ef 0,transparent 35%),
    radial-gradient(circle at top right,#eee5ff 0,transparent 32%),
    linear-gradient(180deg,#fff9fc 0%,#fff0f6 55%,#faf3ff 100%);
}

.container{
  max-width:900px;
  margin:auto;
}

.hero{
  padding:28px 22px;
  margin-bottom:18px;
  border-radius:28px;
  color:white;
  background:linear-gradient(135deg,#ff8eb9,#f7a2c9 50%,#be9dff);
  box-shadow:0 14px 35px rgba(225,110,165,.24);
}

.hero h1{
  margin:0 0 7px;
  font-size:27px;
}

.hero p{
  margin:0;
  font-size:14px;
}

.card{
  padding:18px;
  margin-bottom:16px;
  border-radius:22px;
  background:rgba(255,255,255,.96);
  border:1px solid #f3d5e2;
  box-shadow:0 10px 28px rgba(210,120,160,.08);
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr 110px 145px;
  gap:10px;
}

input{
  width:100%;
  padding:14px;
  border:1.5px solid #f1cede;
  border-radius:14px;
  background:#fffafd;
  color:#654455;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#f08fba;
  box-shadow:0 0 0 4px rgba(240,143,186,.14);
}

button{
  font-family:inherit;
  cursor:pointer;
}

.add{
  border:0;
  border-radius:14px;
  color:white;
  font-size:16px;
  font-weight:800;
  background:linear-gradient(135deg,#ff7ead,#ef8fc6 55%,#ad91f5);
}

.tip{
  margin-top:10px;
  font-size:12px;
  color:#aa8195;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}

.stat{
  padding:14px 6px;
  border-radius:18px;
  text-align:center;
}

.stat:nth-child(1){background:#ffe0ed}
.stat:nth-child(2){background:#ffe8f6}
.stat:nth-child(3){background:#eee6ff}

.stat span{
  display:block;
  font-size:12px;
  opacity:.65;
  margin-bottom:4px;
}

.stat strong{
  font-size:20px;
}

.section-title{
  margin-bottom:13px;
  font-size:17px;
}

.buyer-card{
  margin-bottom:11px;
  border:1px solid #f1d7e3;
  border-radius:18px;
  background:#fff;
  overflow:hidden;
  transition:transform .15s, box-shadow .15s;
}

.buyer-card.dragging{
  opacity:.65;
  transform:scale(1.02);
  box-shadow:0 12px 25px rgba(220,100,155,.22);
}

.buyer-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px;
  background:linear-gradient(135deg,#fff4f8,#fbf2ff);
}

.buyer-main{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  cursor:pointer;
}

.avatar{
  width:38px;
  height:38px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:white;
  background:linear-gradient(135deg,#ffb4cf,#c9b1ff);
}

.buyer-name{
  font-weight:800;
  font-size:16px;
}

.buyer-total{
  margin-top:2px;
  font-size:12px;
  color:#aa8094;
}

.header-tools{
  display:flex;
  align-items:center;
  gap:5px;
}

.arrow{
  padding:7px;
  color:#a07489;
  font-size:18px;
  cursor:pointer;
}

.drag-handle{
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  border-radius:11px;
  color:#bd7698;
  background:#f8e8f0;
  font-size:21px;
  font-weight:bold;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.drag-handle:active{
  cursor:grabbing;
}

.buyer-detail{
  display:none;
  padding:12px 14px 14px;
}

.buyer-card.open .buyer-detail{
  display:block;
}

.item-row{
  display:grid;
  grid-template-columns:38px 1fr 82px 65px;
  gap:7px;
  align-items:center;
  padding:8px 3px;
  border-bottom:1px solid #f6e9ef;
  transition:transform .15s;
}

.item-row.dragging{
  opacity:.55;
  background:#fff0f6;
  border-radius:12px;
}

.item-handle{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  border-radius:9px;
  background:#faedf3;
  color:#c17a9b;
  font-size:18px;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.item-name{
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
}

.qty{
  padding:9px 5px;
  text-align:center;
  border-radius:10px;
}

.item-delete{
  padding:9px 5px;
  border:0;
  border-radius:10px;
  background:#ffe6ef;
  color:#cf5f82;
  font-weight:800;
}

.buyer-delete{
  margin-top:11px;
  padding:10px 12px;
  border:0;
  border-radius:11px;
  background:#f2edf0;
  color:#9d7889;
  font-weight:700;
}

.empty{
  padding:36px 20px;
  text-align:center;
  color:#b18a9d;
}

.reset{
  padding:11px 14px;
  border:0;
  border-radius:12px;
  background:#f3eaf0;
  color:#a1778b;
  font-weight:700;
}

@media(max-width:760px){
  .form{
    grid-template-columns:1fr 1fr;
  }

  .add{
    grid-column:1/-1;
    min-height:48px;
  }

  .item-row{
    grid-template-columns:34px 1fr 70px 58px;
    gap:5px;
  }

  .item-delete{
    font-size:12px;
  }

  .hero h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="hero">
  <h1>🎀 은별이방 쿠폰 기록</h1>
  <p>구매자와 쿠폰 순서를 원하는 대로 정리해보세요 ♡</p>
</div>

<div class="card">

  <div class="form">
    <input id="buyer" placeholder="구매한 이름">
    <input id="product" placeholder="구매한 항목">

    <input
      id="count"
      type="number"
      min="1"
      value="1"
      placeholder="개수">

    <button id="addButton" class="add">
      ＋ 기록 추가
    </button>
  </div>

  <div class="tip">
    ☰ 버튼을 누른 채 위아래로 움직이면 순서를 바꿀 수 있어요.
  </div>

</div>

<div class="stats">

  <div class="stat">
    <span>구매자</span>
    <strong id="peopleCount">0명</strong>
  </div>

  <div class="stat">
    <span>쿠폰 항목</span>
    <strong id="itemCount">0개</strong>
  </div>

  <div class="stat">
    <span>전체 수량</span>
    <strong id="totalCount">0개</strong>
  </div>

</div>

<div class="card">

  <div class="section-title">
    <b>🩷 구매자별 쿠폰 기록</b>
  </div>

  <div id="buyerList"></div>

</div>

<button id="resetButton" class="reset">
  전체 기록 삭제
</button>

</div>

<script>
var records = {
  items: [],
  people: {},
  order: [],
  itemOrders: {}
};

try {
  var saved = localStorage.getItem("buyerTracker");

  if(saved){
    var loaded = JSON.parse(saved);

    records.items = loaded.items || [];
    records.people = loaded.people || {};
    records.order = loaded.order || Object.keys(records.people);
    records.itemOrders = loaded.itemOrders || {};
  }
}catch(e){}

function save(){
  localStorage.setItem(
    "buyerTracker",
    JSON.stringify(records)
  );
}

function normalizeOrders(){

  records.order = records.order.filter(function(name){
    return records.people[name];
  });

  Object.keys(records.people).forEach(function(name){

    if(!records.order.includes(name)){
      records.order.push(name);
    }

    if(!records.itemOrders[name]){
      records.itemOrders[name] =
        Object.keys(records.people[name]);
    }

    records.itemOrders[name] =
      records.itemOrders[name].filter(function(product){
        return records.people[name][product] !== undefined;
      });

    Object.keys(records.people[name]).forEach(function(product){

      if(!records.itemOrders[name].includes(product)){
        records.itemOrders[name].push(product);
      }

    });

  });
}

function addRecord(){

  var buyer =
    document.getElementById("buyer").value.trim();

  var product =
    document.getElementById("product").value.trim();

  var count =
    parseInt(document.getElementById("count").value);

  if(!buyer){
    alert("구매한 이름을 입력해주세요.");
    return;
  }

  if(!product){
    alert("구매한 항목을 입력해주세요.");
    return;
  }

  if(!count || count < 1){
    alert("개수를 입력해주세요.");
    return;
  }

  if(!records.people[buyer]){
    records.people[buyer] = {};
    records.order.push(buyer);
    records.itemOrders[buyer] = [];
  }

  if(records.people[buyer][product] === undefined){
    records.people[buyer][product] = 0;
    records.itemOrders[buyer].push(product);
  }

  records.people[buyer][product] += count;

  if(!records.items.includes(product)){
    records.items.push(product);
  }

  save();

  document.getElementById("buyer").value = "";
  document.getElementById("product").value = "";
  document.getElementById("count").value = "1";

  drawBuyers();
}

function changeQty(buyer, product, value){

  var number = parseInt(value);

  if(isNaN(number) || number < 0){
    number = 0;
  }

  if(number === 0){

    delete records.people[buyer][product];

    records.itemOrders[buyer] =
      records.itemOrders[buyer].filter(function(p){
        return p !== product;
      });

  }else{
    records.people[buyer][product] = number;
  }

  save();
  drawBuyers();
}

function deleteItem(buyer, product){

  if(confirm(product + " 항목을 삭제할까요?")){

    delete records.people[buyer][product];

    records.itemOrders[buyer] =
      records.itemOrders[buyer].filter(function(p){
        return p !== product;
      });

    save();
    drawBuyers();
  }
}

function deleteBuyer(buyer){

  if(confirm(buyer + "님의 모든 기록을 삭제할까요?")){

    delete records.people[buyer];
    delete records.itemOrders[buyer];

    records.order =
      records.order.filter(function(name){
        return name !== buyer;
      });

    save();
    drawBuyers();
  }
}

function updateStats(){

  var buyers = Object.keys(records.people);
  var usedItems = {};
  var total = 0;

  buyers.forEach(function(buyer){

    Object.keys(records.people[buyer]).forEach(function(product){

      usedItems[product] = true;
      total += records.people[buyer][product] || 0;

    });

  });

  document.getElementById("peopleCount").textContent =
    buyers.length + "명";

  document.getElementById("itemCount").textContent =
    Object.keys(usedItems).length + "개";

  document.getElementById("totalCount").textContent =
    total + "개";
}

/* 드래그 공통 기능 */
function makeSortable(container, handleSelector, itemSelector, onChange){

  var dragged = null;
  var pointerId = null;

  container.addEventListener("pointerdown", function(e){

    var handle = e.target.closest(handleSelector);

    if(!handle) return;

    var item = handle.closest(itemSelector);

    if(!item) return;

    dragged = item;
    pointerId = e.pointerId;

    handle.setPointerCapture(pointerId);

    dragged.classList.add("dragging");

    e.preventDefault();
  });

  container.addEventListener("pointermove", function(e){

    if(!dragged) return;

    var elements =
      Array.from(container.querySelectorAll(":scope > " + itemSelector))
      .filter(function(el){
        return el !== dragged;
      });

    var target = null;

    for(var i = 0; i < elements.length; i++){

      var rect = elements[i].getBoundingClientRect();

      if(e.clientY < rect.top + rect.height / 2){
        target = elements[i];
        break;
      }
    }

    if(target){
      container.insertBefore(dragged, target);
    }else{
      container.appendChild(dragged);
    }
  });

  function finish(){

    if(!dragged) return;

    dragged.classList.remove("dragging");

    dragged = null;
    pointerId = null;

    onChange();
  }

  container.addEventListener("pointerup", finish);
  container.addEventListener("pointercancel", finish);
}

function drawBuyers(){

  normalizeOrders();
  updateStats();

  var list = document.getElementById("buyerList");

  if(records.order.length === 0){

    list.innerHTML =
      '<div class="empty">' +
      '🎀 아직 쿠폰 기록이 없어요.' +
      '</div>';

    return;
  }

  list.innerHTML = "";

  records.order.forEach(function(buyer){

    var buyerData = records.people[buyer];
    var products = records.itemOrders[buyer] || [];

    var total = 0;

    products.forEach(function(product){
      total += buyerData[product] || 0;
    });

    var card = document.createElement("div");

    card.className = "buyer-card";
    card.dataset.buyer = buyer;

    var header = document.createElement("div");
    header.className = "buyer-header";

    var main = document.createElement("div");
    main.className = "buyer-main";

    main.innerHTML =
      '<div class="avatar">🎀</div>' +
      '<div>' +
        '<div class="buyer-name"></div>' +
        '<div class="buyer-total">총 ' + total + '개</div>' +
      '</div>';

    main.querySelector(".buyer-name").textContent = buyer;

    main.onclick = function(){
      card.classList.toggle("open");
    };

    var tools = document.createElement("div");
    tools.className = "header-tools";

    var arrow = document.createElement("div");
    arrow.className = "arrow";
    arrow.textContent = "⌄";

    arrow.onclick = function(){
      card.classList.toggle("open");
    };

    var handle = document.createElement("div");
    handle.className = "drag-handle";
    handle.textContent = "☰";
    handle.title = "드래그해서 순서 변경";

    tools.appendChild(arrow);
    tools.appendChild(handle);

    header.appendChild(main);
    header.appendChild(tools);

    var detail = document.createElement("div");
    detail.className = "buyer-detail";

    var itemList = document.createElement("div");
    itemList.className = "item-list";

    products.forEach(function(product){

      var row = document.createElement("div");

      row.className = "item-row";
      row.dataset.product = product;

      var itemHandle = document.createElement("div");

      itemHandle.className = "item-handle";
      itemHandle.textContent = "☰";

      var name = document.createElement("div");

      name.className = "item-name";
      name.textContent = product;

      var input = document.createElement("input");

      input.type = "number";
      input.min = "0";
      input.className = "qty";
      input.value = buyerData[product];

      input.onchange = function(){

        changeQty(
          buyer,
          product,
          this.value
        );

      };

      var del = document.createElement("button");

      del.className = "item-delete";
      del.textContent = "삭제";

      del.onclick = function(){

        deleteItem(
          buyer,
          product
        );

      };

      row.appendChild(itemHandle);
      row.appendChild(name);
      row.appendChild(input);
      row.appendChild(del);

      itemList.appendChild(row);
    });

    detail.appendChild(itemList);

    var buyerDelete = document.createElement("button");

    buyerDelete.className = "buyer-delete";
    buyerDelete.textContent = "구매자 전체 삭제";

    buyerDelete.onclick = function(){
      deleteBuyer(buyer);
    };

    detail.appendChild(buyerDelete);

    card.appendChild(header);
    card.appendChild(detail);

    list.appendChild(card);

    makeSortable(
      itemList,
      ".item-handle",
      ".item-row",
      function(){

        records.itemOrders[buyer] =
          Array.from(
            itemList.querySelectorAll(".item-row")
          ).map(function(row){
            return row.dataset.product;
          });

        save();
      }
    );

  });

  makeSortable(
    list,
    ".drag-handle",
    ".buyer-card",
    function(){

      records.order =
        Array.from(
          list.querySelectorAll(".buyer-card")
        ).map(function(card){
          return card.dataset.buyer;
        });

      save();
    }
  );
}

document.getElementById("addButton").onclick =
  addRecord;

document.getElementById("resetButton").onclick =
function(){

  if(confirm("모든 쿠폰 기록을 삭제할까요?")){

    records = {
      items: [],
      people: {},
      order: [],
      itemOrders: {}
    };

    save();
    drawBuyers();
  }
};

drawBuyers();

</script>
</body>
</html>
