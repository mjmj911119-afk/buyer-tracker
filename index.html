<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOOP갓은별</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:18px 12px 45px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:#634858;
  background:linear-gradient(#fff9fc,#fff0f6,#fff9fc);
}

.wrap{max-width:850px;margin:auto}

.hero{
  overflow:hidden;
  margin-bottom:16px;
  border:1px solid #f1d5e1;
  border-radius:26px;
  background:#fff;
  box-shadow:0 10px 28px rgba(210,110,150,.12);
}

.title{
  padding:22px;
  text-align:center;
  color:#fff;
  background:linear-gradient(135deg,#f28fb5,#e9a5bf,#dca5bf);
}

.title h1{margin:0;font-size:28px;font-weight:900}
.title p{margin:6px 0 0;font-size:13px;color:#fff8fb}

.profile-side{
  display:grid;
  grid-template-columns:minmax(0,1.7fr) minmax(180px,.8fr);
  gap:16px;
  align-items:center;
  padding:18px;
  background:linear-gradient(180deg,#fff,#fff8fb);
}

.photo-side img{
  display:block;
  width:100%;
  max-height:420px;
  object-fit:cover;
  border-radius:22px;
  border:4px solid #fff;
  box-shadow:0 8px 22px rgba(200,100,145,.15);
}

.staff-side{display:flex;flex-direction:column;gap:12px}

.staff-box{
  padding:22px 14px;
  border:1px solid #efd6e1;
  border-radius:17px;
  background:linear-gradient(135deg,#fff,#fff1f6);
  text-align:center;
}

.role{color:#ba7c97;font-size:13px;font-weight:800}
.staff-name{margin-top:6px;color:#624554;font-size:19px;font-weight:900}

/* 큰 메뉴 */

.section{
  margin-bottom:13px;
  overflow:hidden;
  border:1px solid #f0d7e2;
  border-radius:20px;
  background:#fff;
  box-shadow:0 6px 18px rgba(190,100,140,.06);
}

.section-head{
  padding:18px;
  cursor:pointer;
  background:linear-gradient(135deg,#fff,#fff0f6);
  user-select:none;
}

.section-head b{font-size:18px}
.section-head small{display:block;margin-top:4px;color:#b28a9c}

.content{
  display:none;
  padding:16px;
  border-top:1px solid #f4e4eb;
}

.section.open .content{display:block}

/* 입력 */

.form3,.form4{display:grid;gap:8px}
.form3{grid-template-columns:1fr 170px 120px}
.form4{grid-template-columns:1fr 1fr 90px 120px}

input{
  width:100%;
  padding:12px;
  border:1.5px solid #efd3df;
  border-radius:11px;
  outline:none;
  background:#fffafd;
  color:#634858;
  font-size:15px;
}

input:focus{
  border-color:#e89bb8;
  box-shadow:0 0 0 3px rgba(232,155,184,.10);
}

input::placeholder{color:#b89aa7}

.unit{position:relative}
.unit input{padding-right:30px}

.unit span{
  position:absolute;
  right:11px;
  top:50%;
  transform:translateY(-50%);
  color:#aa8495;
  pointer-events:none;
}

button{font-family:inherit;cursor:pointer}

.add{
  border:0;
  border-radius:11px;
  color:#fff;
  background:linear-gradient(135deg,#ed8fb1,#dda0ba);
  font-weight:800;
}

.tip{margin:9px 0 13px;color:#ad8798;font-size:12px}

/* 카드 */

.card{
  margin-bottom:8px;
  overflow:hidden;
  border:1px solid #efdbe4;
  border-radius:15px;
  background:#fff;
}

.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:12px;
  background:#fff7fa;
}

.main{
  display:flex;
  align-items:center;
  gap:9px;
  flex:1;
  min-width:0;
  cursor:pointer;
}

.circle{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  width:41px;
  height:41px;
  border-radius:50%;
  color:#fff;
  background:linear-gradient(135deg,#ed9ab9,#dba6bd);
  font-size:13px;
  font-weight:900;
}

.name{color:#674857;font-weight:900}
.sub{margin-top:2px;color:#b18c9d;font-size:11px}

.tools{display:flex;align-items:center;gap:5px}

.icon,.drag{
  display:flex;
  align-items:center;
  justify-content:center;
  width:36px;
  height:36px;
  padding:0;
  border:1px solid #efd6e0;
  border-radius:9px;
  background:#fff1f6;
}

.drag{
  color:#b87995;
  cursor:grab;
  touch-action:none;
  user-select:none;
  font-size:19px;
}

.dragging{opacity:.5}

.secret,.detail{
  display:none;
  padding:12px;
  border-top:1px solid #f3e4eb;
  background:#fffafd;
}

.card.secret-open .secret,
.card.open .detail{
  display:block;
}

.secret-box{
  padding:13px;
  border:1px solid #efd9e2;
  border-radius:12px;
  background:#fff;
  text-align:center;
}

.secret-box small{color:#ad8798}

.big{
  margin:4px 0 9px;
  color:#674857;
  font-size:21px;
  font-weight:900;
}

.edit,.danger{
  width:100%;
  padding:9px;
  border-radius:9px;
  font-weight:800;
}

.edit{
  border:1px solid #ead6df;
  color:#704f5e;
  background:#fff;
}

.danger{
  border:1px solid #efd4dc;
  color:#ad6178;
  background:#fff0f3;
}

/* 통계 */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin:13px 0;
}

.stats.two{
  grid-template-columns:repeat(2,1fr);
}

.stat{
  padding:10px;
  border-radius:13px;
  background:#fff0f5;
  text-align:center;
}

.stat small{display:block;color:#ae8999}
.stat b{display:block;margin-top:3px;font-size:17px}

/* 쿠폰 */

.item{
  display:grid;
  grid-template-columns:34px 1fr 70px 55px;
  gap:5px;
  align-items:center;
  padding:7px 0;
  border-bottom:1px solid #f2e4ea;
}

.item input{padding:7px;text-align:center}

.del{
  padding:8px 3px;
  border:1px solid #efd4dc;
  border-radius:8px;
  color:#ad6178;
  background:#fff0f3;
  font-size:11px;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.actions button{flex:1}

.empty{
  padding:22px;
  color:#b18e9e;
  text-align:center;
}

@media(max-width:650px){

  .profile-side{grid-template-columns:1fr}

  .staff-side{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .staff-box{padding:14px 8px}
  .staff-name{font-size:16px}

  .form3,.form4{
    grid-template-columns:1fr 1fr;
  }

  .form3 .add,.form4 .add{
    grid-column:1/-1;
    min-height:44px;
  }

  .title h1{font-size:24px}
  .photo-side img{max-height:350px}
}
</style>
</head>

<body>

<div class="wrap">

<!-- 상단 -->

<div class="hero">

  <div class="title">
    <h1>SOOP갓은별</h1>
    <p>은별이와 함께하는 기록 공간 ♡</p>
  </div>

  <div class="profile-side">

    <div class="photo-side">
      <img src="eunbyeol.png.gif" alt="SOOP갓은별">
    </div>

    <div class="staff-side">

      <div class="staff-box">
        <div class="role">👑 회장님</div>
        <div class="staff-name">고집사</div>
      </div>

      <div class="staff-box">
        <div class="role">💗 부회장님</div>
        <div class="staff-name">보노아조씨</div>
      </div>

    </div>

  </div>

</div>


<!-- 열혈 -->

<div class="section" id="hotSection">

  <div class="section-head" onclick="toggleSection('hotSection')">
    <b>🔥 열혈 등수</b>
    <small>눌러서 열혈 기록 보기</small>
  </div>

  <div class="content">

    <div class="form3">

      <input id="hotName" placeholder="열혈 이름">

      <div class="unit">
        <input id="hotCount" inputmode="numeric" placeholder="기여 개수">
        <span>개</span>
      </div>

      <button class="add" id="hotAdd">
        ＋ 추가
      </button>

    </div>

    <div class="tip">
      같은 이름을 다시 입력하면 기여 개수가 자동으로 누적돼요.
    </div>

    <div id="hotList"></div>

  </div>

</div>


<!-- 쿠폰 -->

<div class="section" id="couponSection">

  <div class="section-head" onclick="toggleSection('couponSection')">
    <b>🎟️ 쿠폰</b>
    <small>눌러서 구매자별 쿠폰 보기</small>
  </div>

  <div class="content">

    <div class="form4">

      <input id="buyer" placeholder="구매한 이름">

      <input id="product" placeholder="구매한 항목">

      <input id="count" type="number" min="1" value="1">

      <button class="add" id="couponAdd">
        ＋ 기록 추가
      </button>

    </div>

    <div class="stats">

      <div class="stat">
        <small>구매자</small>
        <b id="peopleCount">0명</b>
      </div>

      <div class="stat">
        <small>쿠폰 항목</small>
        <b id="itemCount">0개</b>
      </div>

      <div class="stat">
        <small>전체 수량</small>
        <b id="totalCount">0개</b>
      </div>

    </div>

    <div id="buyerList"></div>

  </div>

</div>


<!-- 1주년 응모권 -->

<div class="section" id="raffleSection">

  <div class="section-head" onclick="toggleSection('raffleSection')">
    <b>🎫 1주년 응모권</b>
    <small>눌러서 응모권 기록 보기</small>
  </div>

  <div class="content">

    <div class="form3">

      <input
        id="raffleName"
        placeholder="닉네임">

      <div class="unit">
        <input
          id="raffleCount"
          type="number"
          min="1"
          value="1"
          placeholder="응모권 개수">
        <span>개</span>
      </div>

      <button
        class="add"
        id="raffleAdd">
        ＋ 추가
      </button>

    </div>

    <div class="tip">
      같은 닉네임을 다시 입력하면 기존 응모권에 자동으로 더해져요.
    </div>

    <div class="stats two">

      <div class="stat">
        <small>참여자</small>
        <b id="rafflePeople">0명</b>
      </div>

      <div class="stat">
        <small>총 응모권</small>
        <b id="raffleTotal">0개</b>
      </div>

    </div>

    <div id="raffleList"></div>

  </div>

</div>

</div>

<script>

/* 공통 */

function toggleSection(id){
  document.getElementById(id).classList.toggle("open");
}

function digits(v){
  return String(v||"").replace(/[^\d]/g,"");
}

function number(v){
  return parseInt(digits(v),10)||0;
}

function commas(v){
  var d=digits(v);
  return d ? Number(d).toLocaleString("ko-KR") : "";
}


/* 데이터 */

var hot=[];

var coupons={
  people:{},
  order:[],
  itemOrders:{}
};

var raffle=[];


try{
  hot=
    JSON.parse(
      localStorage.getItem("hotRankTracker")
    )||[];
}catch(e){}


try{

  var old=
    JSON.parse(
      localStorage.getItem("buyerTracker")
    )||{};

  coupons.people=old.people||{};
  coupons.order=old.order||Object.keys(coupons.people);
  coupons.itemOrders=old.itemOrders||{};

}catch(e){}


try{

  raffle=
    JSON.parse(
      localStorage.getItem("anniversaryRaffleTracker")
    )||[];

}catch(e){}


function saveHot(){
  localStorage.setItem(
    "hotRankTracker",
    JSON.stringify(hot)
  );
}

function saveCoupons(){
  localStorage.setItem(
    "buyerTracker",
    JSON.stringify(coupons)
  );
}

function saveRaffle(){
  localStorage.setItem(
    "anniversaryRaffleTracker",
    JSON.stringify(raffle)
  );
}


document.getElementById("hotCount").oninput=function(){
  this.value=commas(this.value);
};


/* 드래그 */

function sortable(box,handleClass,itemClass,done){

  var moving=null;

  box.onpointerdown=function(e){

    var handle=e.target.closest(handleClass);

    if(!handle)return;

    moving=handle.closest(itemClass);

    if(!moving)return;

    moving.classList.add("dragging");

    try{
      handle.setPointerCapture(e.pointerId);
    }catch(err){}

    e.preventDefault();
    e.stopPropagation();
  };


  box.onpointermove=function(e){

    if(!moving)return;

    var others=
      [...box.children]
      .filter(function(x){
        return x!==moving;
      });

    var before=
      others.find(function(x){

        var r=x.getBoundingClientRect();

        return e.clientY < r.top+r.height/2;
      });

    if(before){
      box.insertBefore(moving,before);
    }else{
      box.appendChild(moving);
    }
  };


  function end(){

    if(!moving)return;

    moving.classList.remove("dragging");

    moving=null;

    done();
  }

  box.onpointerup=end;
  box.onpointercancel=end;
}


/* =====================
   열혈
===================== */

function addHot(){

  var name=
    document.getElementById("hotName").value.trim();

  var cnt=
    number(
      document.getElementById("hotCount").value
    );

  if(!name){
    alert("열혈 이름을 입력해주세요.");
    return;
  }

  if(cnt<1){
    alert("기여 개수를 입력해주세요.");
    return;
  }

  var found=
    hot.find(function(x){
      return x.name===name;
    });

  if(found){

    found.contribution=
      Number(found.contribution||0)+cnt;

  }else{

    hot.push({
      id:String(Date.now())+Math.random(),
      name:name,
      contribution:cnt
    });
  }

  saveHot();

  document.getElementById("hotName").value="";
  document.getElementById("hotCount").value="";

  drawHot();
}


function editHot(id){

  var p=
    hot.find(function(x){
      return x.id===id;
    });

  if(!p)return;

  var v=
    prompt(
      "기여 개수를 수정해주세요.",
      Number(p.contribution||0).toLocaleString("ko-KR")
    );

  if(v===null)return;

  p.contribution=number(v);

  saveHot();
  drawHot();
}


function removeHot(id){

  var p=
    hot.find(function(x){
      return x.id===id;
    });

  if(!p)return;

  if(confirm(p.name+"님을 삭제할까요?")){

    hot=
      hot.filter(function(x){
        return x.id!==id;
      });

    saveHot();
    drawHot();
  }
}


function drawHot(){

  var list=
    document.getElementById("hotList");

  list.innerHTML="";

  if(!hot.length){

    list.innerHTML=
      '<div class="empty">아직 열혈 기록이 없어요.</div>';

    return;
  }


  hot.forEach(function(p,i){

    var card=
      document.createElement("div");

    card.className="card";
    card.dataset.id=p.id;

    card.innerHTML=`

      <div class="card-head">

        <div class="main">

          <div class="circle">
            ${i+1}위
          </div>

          <div class="name"></div>

        </div>

        <div class="tools">

          <button class="icon lock">🔒</button>

          <button class="icon trash">🗑️</button>

          <div class="drag">☰</div>

        </div>

      </div>

      <div class="secret">

        <div class="secret-box">

          <small>기여 개수</small>

          <div class="big">
            ${Number(p.contribution||0).toLocaleString("ko-KR")}개
          </div>

          <button class="edit">
            기여 개수 직접 수정
          </button>

        </div>

      </div>
    `;

    card.querySelector(".name").textContent=p.name;

    card.querySelector(".lock").onclick=function(e){

      e.stopPropagation();

      card.classList.toggle("secret-open");

      this.textContent=
        card.classList.contains("secret-open")
        ?"🔓"
        :"🔒";
    };

    card.querySelector(".trash").onclick=function(e){

      e.stopPropagation();

      removeHot(p.id);
    };

    card.querySelector(".edit").onclick=function(){
      editHot(p.id);
    };

    list.appendChild(card);
  });


  sortable(
    list,
    ".drag",
    ".card",
    function(){

      var ids=
        [...list.querySelectorAll(".card")]
        .map(function(x){
          return x.dataset.id;
        });

      hot.sort(function(a,b){
        return ids.indexOf(a.id)-ids.indexOf(b.id);
      });

      saveHot();
      drawHot();
    }
  );
}


/* =====================
   쿠폰
===================== */

function normalize(){

  coupons.order=
    coupons.order.filter(function(x){
      return coupons.people[x];
    });

  Object.keys(coupons.people)
  .forEach(function(name){

    if(!coupons.order.includes(name)){
      coupons.order.push(name);
    }

    if(!coupons.itemOrders[name]){

      coupons.itemOrders[name]=
        Object.keys(coupons.people[name]);
    }

    coupons.itemOrders[name]=
      coupons.itemOrders[name]
      .filter(function(x){
        return coupons.people[name][x]!==undefined;
      });

    Object.keys(coupons.people[name])
    .forEach(function(p){

      if(!coupons.itemOrders[name].includes(p)){
        coupons.itemOrders[name].push(p);
      }
    });
  });
}


function addCoupon(){

  var buyer=
    document.getElementById("buyer").value.trim();

  var product=
    document.getElementById("product").value.trim();

  var cnt=
    parseInt(
      document.getElementById("count").value
    )||0;

  if(!buyer){
    alert("구매한 이름을 입력해주세요.");
    return;
  }

  if(!product){
    alert("구매한 항목을 입력해주세요.");
    return;
  }

  if(cnt<1){
    alert("개수를 입력해주세요.");
    return;
  }

  if(!coupons.people[buyer]){

    coupons.people[buyer]={};
    coupons.order.push(buyer);
    coupons.itemOrders[buyer]=[];
  }

  if(coupons.people[buyer][product]===undefined){

    coupons.people[buyer][product]=0;

    coupons.itemOrders[buyer].push(product);
  }

  coupons.people[buyer][product]+=cnt;

  saveCoupons();

  document.getElementById("buyer").value="";
  document.getElementById("product").value="";
  document.getElementById("count").value="1";

  drawCoupons();
}


function renameBuyer(oldName){

  var newName=
    prompt(
      "새 이름을 입력해주세요.",
      oldName
    );

  if(newName===null)return;

  newName=newName.trim();

  if(!newName||newName===oldName)return;

  if(coupons.people[newName]){
    alert("이미 같은 이름이 있어요.");
    return;
  }

  coupons.people[newName]=
    coupons.people[oldName];

  delete coupons.people[oldName];

  coupons.itemOrders[newName]=
    coupons.itemOrders[oldName]||[];

  delete coupons.itemOrders[oldName];

  var i=
    coupons.order.indexOf(oldName);

  if(i>=0){
    coupons.order[i]=newName;
  }

  saveCoupons();
  drawCoupons();
}


function deleteBuyer(name){

  if(confirm(name+"님의 기록을 삭제할까요?")){

    delete coupons.people[name];
    delete coupons.itemOrders[name];

    coupons.order=
      coupons.order.filter(function(x){
        return x!==name;
      });

    saveCoupons();
    drawCoupons();
  }
}


function drawCoupons(){

  normalize();

  var buyers=
    Object.keys(coupons.people);

  var kinds={};

  var totalAll=0;

  buyers.forEach(function(b){

    Object.keys(coupons.people[b])
    .forEach(function(p){

      kinds[p]=1;

      totalAll+=
        coupons.people[b][p]||0;
    });
  });

  document.getElementById("peopleCount").textContent=
    buyers.length+"명";

  document.getElementById("itemCount").textContent=
    Object.keys(kinds).length+"개";

  document.getElementById("totalCount").textContent=
    totalAll+"개";

  var list=
    document.getElementById("buyerList");

  list.innerHTML="";

  if(!coupons.order.length){

    list.innerHTML=
      '<div class="empty">아직 쿠폰 기록이 없어요.</div>';

    return;
  }


  coupons.order.forEach(function(name){

    var products=
      coupons.itemOrders[name]||[];

    var total=
      products.reduce(
        function(a,p){

          return a+
            (coupons.people[name][p]||0);
        },
        0
      );

    var card=
      document.createElement("div");

    card.className="card";
    card.dataset.buyer=name;

    var head=
      document.createElement("div");

    head.className="card-head";

    var main=
      document.createElement("div");

    main.className="main";

    main.innerHTML=`

      <div class="circle">♥</div>

      <div>

        <div class="name"></div>

        <div class="sub">
          총 ${total}개
        </div>

      </div>
    `;

    main.querySelector(".name").textContent=name;

    main.onclick=function(){
      card.classList.toggle("open");
    };

    var drag=
      document.createElement("div");

    drag.className="drag";
    drag.textContent="☰";

    head.appendChild(main);
    head.appendChild(drag);

    var detail=
      document.createElement("div");

    detail.className="detail";

    var itemList=
      document.createElement("div");


    products.forEach(function(product){

      var row=
        document.createElement("div");

      row.className="item";
      row.dataset.product=product;

      var handle=
        document.createElement("div");

      handle.className="drag";
      handle.textContent="☰";

      var label=
        document.createElement("div");

      label.textContent=product;

      var input=
        document.createElement("input");

      input.type="number";
      input.min="0";

      input.value=
        coupons.people[name][product];

      input.onchange=function(){

        var v=
          parseInt(this.value)||0;

        if(v<=0){

          delete coupons.people[name][product];

          coupons.itemOrders[name]=
            coupons.itemOrders[name]
            .filter(function(x){
              return x!==product;
            });

        }else{

          coupons.people[name][product]=v;
        }

        saveCoupons();
        drawCoupons();
      };

      var del=
        document.createElement("button");

      del.className="del";
      del.textContent="삭제";

      del.onclick=function(){

        if(confirm(product+" 항목을 삭제할까요?")){

          delete coupons.people[name][product];

          coupons.itemOrders[name]=
            coupons.itemOrders[name]
            .filter(function(x){
              return x!==product;
            });

          saveCoupons();
          drawCoupons();
        }
      };

      row.append(
        handle,
        label,
        input,
        del
      );

      itemList.appendChild(row);
    });


    detail.appendChild(itemList);

    var actions=
      document.createElement("div");

    actions.className="actions";

    var rename=
      document.createElement("button");

    rename.className="edit";
    rename.textContent="✎ 이름 수정";

    rename.onclick=function(){
      renameBuyer(name);
    };

    var remove=
      document.createElement("button");

    remove.className="danger";
    remove.textContent="구매자 삭제";

    remove.onclick=function(){
      deleteBuyer(name);
    };

    actions.append(
      rename,
      remove
    );

    detail.appendChild(actions);

    card.append(
      head,
      detail
    );

    list.appendChild(card);


    sortable(
      itemList,
      ".drag",
      ".item",
      function(){

        coupons.itemOrders[name]=
          [...itemList.querySelectorAll(".item")]
          .map(function(x){
            return x.dataset.product;
          });

        saveCoupons();
      }
    );
  });


  sortable(
    list,
    ".drag",
    ".card",
    function(){

      coupons.order=
        [...list.querySelectorAll(".card")]
        .map(function(x){
          return x.dataset.buyer;
        });

      saveCoupons();
    }
  );
}


/* =====================
   1주년 응모권
===================== */

function addRaffle(){

  var name=
    document.getElementById("raffleName").value.trim();

  var count=
    parseInt(
      document.getElementById("raffleCount").value
    )||0;

  if(!name){
    alert("닉네임을 입력해주세요.");
    return;
  }

  if(count<1){
    alert("응모권 개수를 입력해주세요.");
    return;
  }

  var existing=
    raffle.find(function(x){
      return x.name===name;
    });

  if(existing){

    existing.count=
      Number(existing.count||0)+count;

  }else{

    raffle.push({
      id:String(Date.now())+Math.random(),
      name:name,
      count:count
    });
  }

  saveRaffle();

  document.getElementById("raffleName").value="";
  document.getElementById("raffleCount").value="1";

  drawRaffle();
}


function editRaffle(id){

  var person=
    raffle.find(function(x){
      return x.id===id;
    });

  if(!person)return;

  var value=
    prompt(
      person.name+"님의 응모권 개수",
      person.count
    );

  if(value===null)return;

  var newCount=
    parseInt(value)||0;

  if(newCount<0)return;

  person.count=newCount;

  saveRaffle();
  drawRaffle();
}


function deleteRaffle(id){

  var person=
    raffle.find(function(x){
      return x.id===id;
    });

  if(!person)return;

  if(confirm(person.name+"님의 응모권 기록을 삭제할까요?")){

    raffle=
      raffle.filter(function(x){
        return x.id!==id;
      });

    saveRaffle();
    drawRaffle();
  }
}


function drawRaffle(){

  document.getElementById("rafflePeople").textContent=
    raffle.length+"명";

  var total=
    raffle.reduce(function(sum,p){
      return sum+Number(p.count||0);
    },0);

  document.getElementById("raffleTotal").textContent=
    total.toLocaleString("ko-KR")+"개";


  var list=
    document.getElementById("raffleList");

  list.innerHTML="";

  if(!raffle.length){

    list.innerHTML=
      '<div class="empty">아직 응모권 기록이 없어요.</div>';

    return;
  }


  raffle.forEach(function(person){

    var card=
      document.createElement("div");

    card.className="card";
    card.dataset.id=person.id;


    var head=
      document.createElement("div");

    head.className="card-head";


    var main=
      document.createElement("div");

    main.className="main";


    main.innerHTML=`

      <div class="circle">🎫</div>

      <div>

        <div class="name"></div>

        <div class="sub">
          응모권 ${Number(person.count||0).toLocaleString("ko-KR")}개
        </div>

      </div>
    `;


    main.querySelector(".name").textContent=
      person.name;


    main.onclick=function(){
      editRaffle(person.id);
    };


    var tools=
      document.createElement("div");

    tools.className="tools";


    var trash=
      document.createElement("button");

    trash.className="icon";

    trash.textContent="🗑️";

    trash.onclick=function(e){

      e.stopPropagation();

      deleteRaffle(person.id);
    };


    var drag=
      document.createElement("div");

    drag.className="drag";

    drag.textContent="☰";


    tools.append(
      trash,
      drag
    );


    head.append(
      main,
      tools
    );


    card.appendChild(head);

    list.appendChild(card);
  });


  sortable(
    list,
    ".drag",
    ".card",
    function(){

      var ids=
        [...list.querySelectorAll(".card")]
        .map(function(x){
          return x.dataset.id;
        });

      raffle.sort(function(a,b){
        return ids.indexOf(a.id)-ids.indexOf(b.id);
      });

      saveRaffle();
      drawRaffle();
    }
  );
}


/* 시작 */

document.getElementById("hotAdd").onclick=
  addHot;

document.getElementById("couponAdd").onclick=
  addCoupon;

document.getElementById("raffleAdd").onclick=
  addRaffle;

drawHot();
drawCoupons();
drawRaffle();
