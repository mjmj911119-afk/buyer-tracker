<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은별이방 기록</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:22px 14px 45px;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:#5e4350;
  background:linear-gradient(180deg,#fff9fc 0%,#fff0f6 55%,#fff8fb 100%);
}

.container{
  max-width:900px;
  margin:auto;
}

/* 상단 */
.hero{
  padding:30px 24px;
  margin-bottom:20px;
  border-radius:28px;
  color:white;
  background:linear-gradient(135deg,#f49abb,#eaa8c1 55%,#dca9c2);
  box-shadow:0 14px 35px rgba(215,110,155,.20);
}

.hero h1{
  margin:0 0 6px;
  font-size:28px;
}

.hero p{
  margin:0;
  font-size:14px;
  color:#fff8fb;
}

/* 큰 메뉴 */
.section{
  margin-bottom:14px;
  overflow:hidden;
  border:1px solid #f0d7e2;
  border-radius:22px;
  background:white;
  box-shadow:0 7px 22px rgba(190,100,140,.07);
}

.section-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:20px;
  cursor:pointer;
  background:linear-gradient(135deg,#fff,#fff0f6);
  user-select:none;
}

.section-header:hover{
  background:#fff3f7;
}

.section-title{
  font-size:19px;
  font-weight:900;
  color:#704d5d;
}

.section-sub{
  margin-top:4px;
  color:#b28b9c;
  font-size:12px;
}

.section-icon{
  width:35px;
  height:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#fbe6ef;
  color:#c67d9c;
  font-size:19px;
  transition:.25s;
}

.section.open .section-icon{
  transform:rotate(180deg);
}

.section-content{
  display:none;
  padding:18px;
  border-top:1px solid #f4e4eb;
}

.section.open .section-content{
  display:block;
}

/* 입력 */
.form{
  display:grid;
  grid-template-columns:1fr 1fr 110px 140px;
  gap:9px;
}

.hot-form{
  display:grid;
  grid-template-columns:1fr 160px 140px;
  gap:9px;
}

input{
  width:100%;
  padding:13px;
  border:1.5px solid #efd3df;
  border-radius:12px;
  outline:none;
  background:#fffafd;
  color:#5e4350;
  font-size:16px;
}

input:focus{
  border-color:#e699b7;
  box-shadow:0 0 0 3px rgba(230,150,185,.10);
}

input::placeholder{
  color:#b89aa7;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.add{
  border:0;
  border-radius:12px;
  color:white;
  background:linear-gradient(135deg,#ed8fb1,#dda0ba);
  font-weight:850;
  font-size:15px;
}

.tip{
  margin:9px 0 15px;
  color:#ae8999;
  font-size:12px;
}

/* 열혈 */
.hot-card,
.buyer-card{
  margin-bottom:9px;
  overflow:hidden;
  border:1px solid #efdbe4;
  border-radius:16px;
  background:white;
}

.hot-header,
.buyer-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px;
  background:linear-gradient(135deg,#fff,#fff5f8);
}

.hot-main,
.buyer-main{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  cursor:pointer;
}

.rank{
  width:44px;
  height:44px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:white;
  background:linear-gradient(135deg,#ed9ab9,#dba6bd);
  font-size:13px;
  font-weight:900;
}

.avatar{
  width:40px;
  height:40px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:white;
  background:linear-gradient(135deg,#efa0bd,#dca9c0);
}

.name{
  font-size:16px;
  font-weight:850;
  color:#674857;
}

.sub{
  margin-top:2px;
  font-size:12px;
  color:#b28e9e;
}

/* 드래그 */
.drag-handle,
.item-handle{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  border:1px solid #efd7e1;
  border-radius:10px;
  color:#b77d96;
  background:#fff2f7;
  cursor:grab;
  touch-action:none;
  user-select:none;
}

.drag-handle{
  width:38px;
  height:38px;
  font-size:20px;
}

.item-handle{
  width:33px;
  height:33px;
  font-size:17px;
}

.dragging{
  opacity:.55;
}

/* 펼쳐지는 내부 */
.hot-detail,
.buyer-detail{
  display:none;
  padding:13px;
  border-top:1px solid #f3e4eb;
  background:#fffafd;
}

.hot-card.open .hot-detail,
.buyer-card.open .buyer-detail{
  display:block;
}

/* 열혈 수정 */
.hot-edit{
  display:grid;
  grid-template-columns:1fr 150px 90px;
  gap:8px;
}

.save-btn{
  border:0;
  border-radius:11px;
  color:white;
  background:#dc91ad;
  font-weight:800;
}

.delete-btn{
  margin-top:9px;
  width:100%;
  padding:10px;
  border:1px solid #efd4dc;
  border-radius:11px;
  color:#ad6178;
  background:#fff0f3;
  font-weight:800;
}

/* 쿠폰 통계 */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:15px 0;
}

.stat{
  padding:12px 5px;
  border-radius:15px;
  text-align:center;
  background:#fff1f6;
}

.stat span{
  display:block;
  color:#af8999;
  font-size:11px;
}

.stat strong{
  display:block;
  margin-top:3px;
  color:#674858;
  font-size:18px;
}

/* 쿠폰 */
.item-row{
  display:grid;
  grid-template-columns:35px 1fr 75px 58px;
  gap:6px;
  align-items:center;
  padding:8px 2px;
  border-bottom:1px solid #f2e4ea;
}

.item-name{
  overflow:hidden;
  font-weight:700;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.qty{
  padding:8px 4px;
  text-align:center;
}

.small-delete{
  padding:8px 4px;
  border:1px solid #efd4dc;
  border-radius:9px;
  color:#ad6178;
  background:#fff0f3;
  font-size:11px;
  font-weight:800;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:11px;
}

.edit-btn{
  flex:1;
  padding:10px;
  border:1px solid #ead7df;
  border-radius:10px;
  background:white;
  color:#704f5e;
  font-weight:800;
}

.danger-btn{
  flex:1;
  padding:10px;
  border:1px solid #efd4dc;
  border-radius:10px;
  background:#fff0f3;
  color:#ad6178;
  font-weight:800;
}

.empty{
  padding:25px;
  text-align:center;
  color:#b292a0;
}

@media(max-width:700px){

  .form,
  .hot-form{
    grid-template-columns:1fr 1fr;
  }

  .form .add,
  .hot-form .add{
    grid-column:1/-1;
    min-height:46px;
  }

  .hot-edit{
    grid-template-columns:1fr 110px;
  }

  .hot-edit .save-btn{
    grid-column:1/-1;
    min-height:42px;
  }

  .hero h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1>🌸 은별이방 기록</h1>
    <p>필요한 기록만 눌러서 확인해요 ♡</p>
  </div>


  <!-- 열혈 등수 -->
  <div class="section" id="hotSection">

    <div class="section-header" onclick="toggleSection('hotSection')">

      <div>
        <div class="section-title">🔥 열혈 등수</div>
        <div class="section-sub">눌러서 열혈 기록 보기</div>
      </div>

      <div class="section-icon">⌄</div>

    </div>


    <div class="section-content">

      <div class="hot-form">

        <input id="hotName" placeholder="열혈 이름">

        <input
          id="hotCount"
          type="number"
          min="0"
          placeholder="기여 개수">

        <button
          class="add"
          id="hotAddButton">
          ＋ 추가
        </button>

      </div>

      <div class="tip">
        ☰를 잡아 순서를 바꾸면 등수가 자동으로 변경돼요.
      </div>

      <div id="hotList"></div>

    </div>

  </div>


  <!-- 쿠폰 -->
  <div class="section" id="couponSection">

    <div class="section-header" onclick="toggleSection('couponSection')">

      <div>
        <div class="section-title">🎟️ 쿠폰 기록</div>
        <div class="section-sub">눌러서 구매자별 쿠폰 보기</div>
      </div>

      <div class="section-icon">⌄</div>

    </div>


    <div class="section-content">

      <div class="form">

        <input id="buyer" placeholder="구매한 이름">

        <input id="product" placeholder="구매한 항목">

        <input
          id="count"
          type="number"
          min="1"
          value="1"
          placeholder="개수">

        <button
          class="add"
          id="addButton">
          ＋ 기록 추가
        </button>

      </div>

      <div class="stats">

        <div class="stat">
          <span>구매자</span>
          <strong id="peopleCount">0명</strong>
        </div>

        <div class="stat">
          <span>쿠폰 항목</span>
          <strong id="itemCount">0개</strong>
        </div>

        <div class="stat">
          <span>전체 수량</span>
          <strong id="totalCount">0개</strong>
        </div>

      </div>

      <div class="tip">
        구매자를 누르면 쿠폰이 펼쳐져요. ☰로 순서를 바꿀 수 있어요.
      </div>

      <div id="buyerList"></div>

    </div>

  </div>

</div>


<script>

/* ========================
   큰 메뉴 열기/닫기
======================== */

function toggleSection(id){

  document
    .getElementById(id)
    .classList
    .toggle("open");

}


/* ========================
   저장된 데이터
======================== */

var records={
  items:[],
  people:{},
  order:[],
  itemOrders:{}
};

var hotRecords=[];


try{

  var saved=localStorage.getItem("buyerTracker");

  if(saved){

    var loaded=JSON.parse(saved);

    records.items=loaded.items||[];
    records.people=loaded.people||{};
    records.order=loaded.order||Object.keys(records.people);
    records.itemOrders=loaded.itemOrders||{};

  }

}catch(e){}


try{

  var hotSaved=localStorage.getItem("hotRankTracker");

  if(hotSaved){

    hotRecords=JSON.parse(hotSaved)||[];

  }

}catch(e){}


function saveCoupons(){

  localStorage.setItem(
    "buyerTracker",
    JSON.stringify(records)
  );

}


function saveHot(){

  localStorage.setItem(
    "hotRankTracker",
    JSON.stringify(hotRecords)
  );

}


/* ========================
   공통 드래그
======================== */

function makeSortable(
  container,
  handleSelector,
  itemSelector,
  callback
){

  var dragged=null;

  container.onpointerdown=function(e){

    var handle=e.target.closest(handleSelector);

    if(!handle)return;

    var item=handle.closest(itemSelector);

    if(!item)return;

    dragged=item;

    dragged.classList.add("dragging");

    try{
      handle.setPointerCapture(e.pointerId);
    }catch(err){}

    e.preventDefault();
    e.stopPropagation();

  };


  container.onpointermove=function(e){

    if(!dragged)return;

    var others=
      Array.from(container.children)
      .filter(function(el){

        return el.matches(itemSelector)&&el!==dragged;

      });


    var target=null;


    for(var i=0;i<others.length;i++){

      var rect=others[i].getBoundingClientRect();

      if(e.clientY<rect.top+rect.height/2){

        target=others[i];

        break;

      }

    }


    if(target){

      container.insertBefore(dragged,target);

    }else{

      container.appendChild(dragged);

    }

  };


  function finish(){

    if(!dragged)return;

    dragged.classList.remove("dragging");

    dragged=null;

    callback();

  }


  container.onpointerup=finish;
  container.onpointercancel=finish;

}


/* ========================
   열혈
======================== */

function addHot(){

  var name=
    document.getElementById("hotName").value.trim();

  var count=
    parseInt(
      document.getElementById("hotCount").value
    );


  if(!name){

    alert("열혈 이름을 입력해주세요.");

    return;

  }


  if(isNaN(count)||count<0){
    count=0;
  }


  hotRecords.push({

    id:
      Date.now().toString()+
      Math.random().toString(),

    name:name,

    contribution:count

  });


  saveHot();


  document.getElementById("hotName").value="";
  document.getElementById("hotCount").value="";


  drawHot();

}


function updateHot(id){

  var person=
    hotRecords.find(function(p){
      return p.id===id;
    });


  if(!person)return;


  var nameInput=
    document.getElementById(
      "hot-name-"+id
    );


  var countInput=
    document.getElementById(
      "hot-count-"+id
    );


  var newName=
    nameInput.value.trim();


  var newCount=
    parseInt(countInput.value);


  if(!newName){

    alert("이름을 입력해주세요.");

    return;

  }


  if(isNaN(newCount)||newCount<0){

    alert("기여 개수를 확인해주세요.");

    return;

  }


  person.name=newName;
  person.contribution=newCount;


  saveHot();

  drawHot();

}


function deleteHot(id){

  var person=
    hotRecords.find(function(p){
      return p.id===id;
    });


  if(!person)return;


  if(
    confirm(
      person.name+
      "님을 삭제할까요?"
    )
  ){

    hotRecords=
      hotRecords.filter(function(p){
        return p.id!==id;
      });


    saveHot();

    drawHot();

  }

}


function drawHot(){

  var list=
    document.getElementById("hotList");


  if(hotRecords.length===0){

    list.innerHTML=
      '<div class="empty">아직 열혈 기록이 없어요.</div>';

    return;

  }


  list.innerHTML="";


  hotRecords.forEach(function(person,index){

    var card=document.createElement("div");

    card.className="hot-card";
    card.dataset.id=person.id;


    var header=document.createElement("div");

    header.className="hot-header";


    var main=document.createElement("div");

    main.className="hot-main";


    var rank=document.createElement("div");

    rank.className="rank";
    rank.textContent=(index+1)+"위";


    var info=document.createElement("div");


    var name=document.createElement("div");

    name.className="name";
    name.textContent=person.name;


    var sub=document.createElement("div");

    sub.className="sub";
    sub.textContent="눌러서 기여 개수 확인 / 수정";


    info.appendChild(name);
    info.appendChild(sub);


    main.appendChild(rank);
    main.appendChild(info);


    main.onclick=function(){

      card.classList.toggle("open");

    };


    var handle=document.createElement("div");

    handle.className="drag-handle";
    handle.textContent="☰";


    header.appendChild(main);
    header.appendChild(handle);


    var detail=document.createElement("div");

    detail.className="hot-detail";


    var edit=document.createElement("div");

    edit.className="hot-edit";


    var nameInput=document.createElement("input");

    nameInput.id="hot-name-"+person.id;
    nameInput.value=person.name;
    nameInput.placeholder="이름";


    var countInput=document.createElement("input");

    countInput.id="hot-count-"+person.id;
    countInput.type="number";
    countInput.min="0";
    countInput.value=person.contribution;
    countInput.placeholder="기여 개수";


    var saveButton=document.createElement("button");

    saveButton.className="save-btn";
    saveButton.textContent="저장";

    saveButton.onclick=function(){

      updateHot(person.id);

    };


    edit.appendChild(nameInput);
    edit.appendChild(countInput);
    edit.appendChild(saveButton);


    var deleteButton=document.createElement("button");

    deleteButton.className="delete-btn";
    deleteButton.textContent="열혈 기록 삭제";

    deleteButton.onclick=function(){

      deleteHot(person.id);

    };


    detail.appendChild(edit);
    detail.appendChild(deleteButton);


    card.appendChild(header);
    card.appendChild(detail);


    list.appendChild(card);

  });


  makeSortable(
    list,
    ".drag-handle",
    ".hot-card",
    function(){

      var ids=
        Array.from(
          list.querySelectorAll(".hot-card")
        )
        .map(function(card){
          return card.dataset.id;
        });


      hotRecords.sort(function(a,b){

        return (
          ids.indexOf(a.id)-
          ids.indexOf(b.id)
        );

      });


      saveHot();

      drawHot();

    }
  );

}


/* ========================
   쿠폰
======================== */

function normalizeCoupons(){

  records.order=
    records.order.filter(function(name){
      return records.people[name];
    });


  Object.keys(records.people).forEach(function(name){

    if(records.order.indexOf(name)===-1){
      records.order.push(name);
    }


    if(!records.itemOrders[name]){

      records.itemOrders[name]=
        Object.keys(records.people[name]);

    }


    records.itemOrders[name]=
      records.itemOrders[name]
      .filter(function(product){

        return records.people[name][product]!==undefined;

      });


    Object.keys(records.people[name]).forEach(function(product){

      if(
        records.itemOrders[name].indexOf(product)===-1
      ){

        records.itemOrders[name].push(product);

      }

    });

  });

}


function addRecord(){

  var buyer=
    document.getElementById("buyer").value.trim();

  var product=
    document.getElementById("product").value.trim();

  var count=
    parseInt(
      document.getElementById("count").value
    );


  if(!buyer){

    alert("구매한 이름을 입력해주세요.");

    return;

  }


  if(!product){

    alert("구매한 항목을 입력해주세요.");

    return;

  }


  if(!count||count<1){

    alert("개수를 입력해주세요.");

    return;

  }


  if(!records.people[buyer]){

    records.people[buyer]={};

    records.order.push(buyer);

    records.itemOrders[buyer]=[];

  }


  if(
    records.people[buyer][product]===undefined
  ){

    records.people[buyer][product]=0;

    records.itemOrders[buyer].push(product);

  }


  records.people[buyer][product]+=count;


  saveCoupons();


  document.getElementById("buyer").value="";
  document.getElementById("product").value="";
  document.getElementById("count").value="1";


  drawBuyers();

}


function renameBuyer(oldName){

  var newName=
    prompt(
      "새 이름을 입력해주세요.",
      oldName
    );


  if(newName===null)return;


  newName=newName.trim();


  if(!newName||newName===oldName)return;


  if(records.people[newName]){

    alert("이미 같은 이름의 구매자가 있어요.");

    return;

  }


  records.people[newName]=
    records.people[oldName];


  delete records.people[oldName];


  records.itemOrders[newName]=
    records.itemOrders[oldName]||[];


  delete records.itemOrders[oldName];


  var index=
    records.order.indexOf(oldName);


  if(index!==-1){

    records.order[index]=newName;

  }


  saveCoupons();

  drawBuyers();

}


function changeQty(buyer,product,value){

  var number=parseInt(value);


  if(isNaN(number)||number<0){
    number=0;
  }


  if(number===0){

    delete records.people[buyer][product];


    records.itemOrders[buyer]=
      records.itemOrders[buyer]
      .filter(function(p){

        return p!==product;

      });

  }else{

    records.people[buyer][product]=number;

  }


  saveCoupons();

  drawBuyers();

}


function deleteItem(buyer,product){

  if(confirm(product+" 항목을 삭제할까요?")){

    delete records.people[buyer][product];


    records.itemOrders[buyer]=
      records.itemOrders[buyer]
      .filter(function(p){

        return p!==product;

      });


    saveCoupons();

    drawBuyers();

  }

}


function deleteBuyer(buyer){

  if(confirm(buyer+"님의 기록을 삭제할까요?")){

    delete records.people[buyer];

    delete records.itemOrders[buyer];


    records.order=
      records.order.filter(function(name){

        return name!==buyer;

      });


    saveCoupons();

    drawBuyers();

  }

}


function updateStats(){

  var buyers=
    Object.keys(records.people);

  var items={};

  var total=0;


  buyers.forEach(function(buyer){

    Object.keys(records.people[buyer]).forEach(function(product){

      items[product]=true;

      total+=records.people[buyer][product]||0;

    });

  });


  document.getElementById("peopleCount").textContent=
    buyers.length+"명";

  document.getElementById("itemCount").textContent=
    Object.keys(items).length+"개";

  document.getElementById("totalCount").textContent=
    total+"개";

}


function drawBuyers(){

  normalizeCoupons();

  updateStats();


  var list=
    document.getElementById("buyerList");


  if(records.order.length===0){

    list.innerHTML=
      '<div class="empty">아직 쿠폰 기록이 없어요.</div>';

    return;

  }


  list.innerHTML="";


  records.order.forEach(function(buyer){

    var data=records.people[buyer];

    var products=
      records.itemOrders[buyer]||[];


    var total=0;


    products.forEach(function(product){

      total+=data[product]||0;

    });


    var card=document.createElement("div");

    card.className="buyer-card";
    card.dataset.buyer=buyer;


    var header=document.createElement("div");

    header.className="buyer-header";


    var main=document.createElement("div");

    main.className="buyer-main";


    var avatar=document.createElement("div");

    avatar.className="avatar";
    avatar.textContent="♥";


    var info=document.createElement("div");


    var name=document.createElement("div");

    name.className="name";
    name.textContent=buyer;


    var sub=document.createElement("div");

    sub.className="sub";
    sub.textContent="총 "+total+"개";


    info.appendChild(name);
    info.appendChild(sub);


    main.appendChild(avatar);
    main.appendChild(info);


    main.onclick=function(){

      card.classList.toggle("open");

    };


    var handle=document.createElement("div");

    handle.className="drag-handle";
    handle.textContent="☰";


    header.appendChild(main);
    header.appendChild(handle);


    var detail=document.createElement("div");

    detail.className="buyer-detail";


    var itemList=document.createElement("div");


    products.forEach(function(product){

      if(data[product]===undefined)return;


      var row=document.createElement("div");

      row.className="item-row";
      row.dataset.product=product;


      var itemHandle=document.createElement("div");

      itemHandle.className="item-handle";
      itemHandle.textContent="☰";


      var itemName=document.createElement("div");

      itemName.className="item-name";
      itemName.textContent=product;


      var qty=document.createElement("input");

      qty.type="number";
      qty.min="0";
      qty.className="qty";
      qty.value=data[product];

      qty.onchange=function(){

        changeQty(
          buyer,
          product,
          this.value
        );

      };


      var del=document.createElement("button");

      del.className="small-delete";
      del.textContent="삭제";

      del.onclick=function(){

        deleteItem(buyer,product);

      };


      row.appendChild(itemHandle);
      row.appendChild(itemName);
      row.appendChild(qty);
      row.appendChild(del);


      itemList.appendChild(row);

    });


    detail.appendChild(itemList);


    var actions=document.createElement("div");

    actions.className="actions";


    var rename=document.createElement("button");

    rename.className="edit-btn";
    rename.textContent="✎ 이름 수정";

    rename.onclick=function(){

      renameBuyer(buyer);

    };


    var deleteBtn=document.createElement("button");

    deleteBtn.className="danger-btn";
    deleteBtn.textContent="구매자 삭제";

    deleteBtn.onclick=function(){

      deleteBuyer(buyer);

    };


    actions.appendChild(rename);
    actions.appendChild(deleteBtn);


    detail.appendChild(actions);


    card.appendChild(header);
    card.appendChild(detail);


    list.appendChild(card);


    makeSortable(
      itemList,
      ".item-handle",
      ".item-row",
      function(){

        records.itemOrders[buyer]=
          Array.from(
            itemList.querySelectorAll(".item-row")
          )
          .map(function(row){

            return row.dataset.product;

          });


        saveCoupons();

      }
    );

  });


  makeSortable(
    list,
    ".drag-handle",
    ".buyer-card",
    function(){

      records.order=
        Array.from(
          list.querySelectorAll(".buyer-card")
        )
        .map(function(card){

          return card.dataset.buyer;

        });


      saveCoupons();

    }
  );

}


/* 버튼 */

document.getElementById("hotAddButton").onclick=addHot;

document.getElementById("addButton").onclick=addRecord;


/* 시작 */

drawHot();

drawBuyers();

</script>

</body>
</html>
