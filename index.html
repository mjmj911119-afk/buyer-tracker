<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOOP갓은별</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:22px 14px 45px;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:#5e4350;
  background:
    radial-gradient(circle at top left,#ffffff 0,transparent 30%),
    radial-gradient(circle at top right,#ffe3ef 0,transparent 35%),
    linear-gradient(180deg,#fff9fc 0%,#fff0f6 55%,#fff8fb 100%);
}

.container{
  max-width:900px;
  margin:auto;
}

/* 상단 프로필 */

.hero{
  overflow:hidden;
  margin-bottom:20px;
  border:1px solid #f0d2df;
  border-radius:30px;
  background:white;
  box-shadow:0 14px 35px rgba(215,110,155,.14);
}

.hero-title{
  padding:24px 20px 18px;
  text-align:center;
  color:white;
  background:linear-gradient(135deg,#f493b7,#eba8c1 55%,#dca6bf);
}

.hero-title h1{
  margin:0;
  font-size:30px;
  font-weight:900;
  letter-spacing:-1px;
}

.hero-title p{
  margin:6px 0 0;
  font-size:13px;
  color:#fff7fb;
}

.profile-area{
  padding:18px;
  text-align:center;
  background:linear-gradient(180deg,#fff,#fff7fa);
}

.profile-photo-wrap{
  position:relative;
  max-width:500px;
  margin:0 auto;
}

.profile-photo{
  display:block;
  width:100%;
  max-height:430px;
  object-fit:cover;
  border:5px solid white;
  border-radius:25px;
  box-shadow:0 12px 30px rgba(205,110,150,.18);
}

.profile-heart{
  position:absolute;
  right:-4px;
  bottom:-8px;
  display:flex;
  align-items:center;
  justify-content:center;
  width:52px;
  height:52px;
  border:4px solid white;
  border-radius:50%;
  color:white;
  background:linear-gradient(135deg,#f58eb5,#dba1bc);
  box-shadow:0 5px 15px rgba(200,100,145,.2);
  font-size:23px;
}

.staff-wrap{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  max-width:500px;
  margin:18px auto 0;
}

.staff{
  padding:14px 12px;
  border:1px solid #efd5e1;
  border-radius:16px;
  background:white;
  box-shadow:0 5px 16px rgba(200,100,145,.07);
}

.staff-role{
  margin-bottom:5px;
  color:#c27696;
  font-size:12px;
  font-weight:800;
}

.staff-name{
  color:#624554;
  font-size:17px;
  font-weight:900;
}

/* 메뉴 */

.section{
  margin-bottom:14px;
  overflow:hidden;
  border:1px solid #f0d7e2;
  border-radius:22px;
  background:white;
  box-shadow:0 7px 22px rgba(190,100,140,.07);
}

.section-header{
  padding:20px;
  cursor:pointer;
  background:linear-gradient(135deg,#fff,#fff0f6);
  user-select:none;
}

.section-title{
  color:#704d5d;
  font-size:19px;
  font-weight:900;
}

.section-sub{
  margin-top:4px;
  color:#b28b9c;
  font-size:12px;
}

.section-content{
  display:none;
  padding:18px;
  border-top:1px solid #f4e4eb;
}

.section.open .section-content{
  display:block;
}

/* 입력 */

.form{
  display:grid;
  grid-template-columns:1fr 1fr 110px 140px;
  gap:9px;
}

.hot-form{
  display:grid;
  grid-template-columns:1fr 180px 140px;
  gap:9px;
}

.input-unit{
  position:relative;
}

.input-unit input{
  padding-right:35px;
}

.input-unit span{
  position:absolute;
  right:13px;
  top:50%;
  transform:translateY(-50%);
  color:#a98193;
  font-size:14px;
  pointer-events:none;
}

input{
  width:100%;
  padding:13px;
  border:1.5px solid #efd3df;
  border-radius:12px;
  outline:none;
  background:#fffafd;
  color:#5e4350;
  font-size:16px;
}

input:focus{
  border-color:#e699b7;
  box-shadow:0 0 0 3px rgba(230,150,185,.10);
}

input::placeholder{
  color:#b89aa7;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.add{
  border:0;
  border-radius:12px;
  color:white;
  background:linear-gradient(135deg,#ed8fb1,#dda0ba);
  font-size:15px;
  font-weight:850;
}

.tip{
  margin:9px 0 15px;
  color:#ae8999;
  font-size:12px;
}

/* 카드 */

.hot-card,
.buyer-card{
  margin-bottom:9px;
  overflow:hidden;
  border:1px solid #efdbe4;
  border-radius:16px;
  background:white;
}

.hot-header,
.buyer-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px;
  background:linear-gradient(135deg,#fff,#fff5f8);
}

.hot-main,
.buyer-main{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  min-width:0;
}

.buyer-main{
  cursor:pointer;
}

.rank,
.avatar{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  border-radius:50%;
  color:white;
  background:linear-gradient(135deg,#ed9ab9,#dba6bd);
}

.rank{
  width:44px;
  height:44px;
  font-size:13px;
  font-weight:900;
}

.avatar{
  width:40px;
  height:40px;
}

.name{
  color:#674857;
  font-size:16px;
  font-weight:850;
}

.sub{
  margin-top:2px;
  color:#b28e9e;
  font-size:12px;
}

/* 열혈 버튼 */

.hot-tools{
  display:flex;
  align-items:center;
  gap:6px;
}

.icon-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  padding:0;
  border:1px solid #efd7e1;
  border-radius:10px;
  background:#fff2f7;
  font-size:17px;
}

.trash-btn{
  background:#fff1f3;
}

/* 드래그 */

.drag-handle,
.item-handle{
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  border:1px solid #efd7e1;
  border-radius:10px;
  color:#b77d96;
  background:#fff2f7;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.drag-handle{
  width:38px;
  height:38px;
  font-size:20px;
}

.item-handle{
  width:33px;
  height:33px;
  font-size:17px;
}

.dragging{
  opacity:.55;
}

/* 열혈 기여개수 */

.hot-secret{
  display:none;
  padding:13px;
  border-top:1px solid #f3e4eb;
  background:#fff9fc;
}

.hot-card.secret-open .hot-secret{
  display:block;
}

.secret-box{
  padding:14px;
  border:1px solid #f0d8e2;
  border-radius:13px;
  background:white;
  text-align:center;
}

.secret-label{
  margin-bottom:4px;
  color:#ae8999;
  font-size:12px;
}

.secret-number{
  color:#674857;
  font-size:22px;
  font-weight:900;
}

.adjust-btn{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:1px solid #ead7df;
  border-radius:10px;
  color:#704f5e;
  background:#fff;
  font-weight:800;
}

/* 쿠폰 */

.buyer-detail{
  display:none;
  padding:13px;
  border-top:1px solid #f3e4eb;
  background:#fffafd;
}

.buyer-card.open .buyer-detail{
  display:block;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:15px 0;
}

.stat{
  padding:12px 5px;
  border-radius:15px;
  text-align:center;
  background:#fff1f6;
}

.stat span{
  display:block;
  color:#af8999;
  font-size:11px;
}

.stat strong{
  display:block;
  margin-top:3px;
  color:#674858;
  font-size:18px;
}

.item-row{
  display:grid;
  grid-template-columns:35px 1fr 75px 58px;
  gap:6px;
  align-items:center;
  padding:8px 2px;
  border-bottom:1px solid #f2e4ea;
}

.item-name{
  overflow:hidden;
  font-weight:700;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.qty{
  padding:8px 4px;
  text-align:center;
}

.small-delete{
  padding:8px 4px;
  border:1px solid #efd4dc;
  border-radius:9px;
  color:#ad6178;
  background:#fff0f3;
  font-size:11px;
  font-weight:800;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:11px;
}

.edit-btn,
.danger-btn{
  flex:1;
  padding:10px;
  border-radius:10px;
  font-weight:800;
}

.edit-btn{
  border:1px solid #ead7df;
  color:#704f5e;
  background:white;
}

.danger-btn{
  border:1px solid #efd4dc;
  color:#ad6178;
  background:#fff0f3;
}

.empty{
  padding:25px;
  color:#b292a0;
  text-align:center;
}

/* 휴대폰 */

@media(max-width:700px){

  .form,
  .hot-form{
    grid-template-columns:1fr 1fr;
  }

  .form .add,
  .hot-form .add{
    grid-column:1/-1;
    min-height:46px;
  }

  .hero-title h1{
    font-size:26px;
  }

  .profile-photo{
    max-height:350px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- 상단 프로필 -->
  <div class="hero">

    <div class="hero-title">
      <h1>🌸 SOOP갓은별</h1>
      <p>은별이와 함께하는 기록 공간 ♡</p>
    </div>

    <div class="profile-area">

      <div class="profile-photo-wrap">

        <!-- 사진 파일 이름 eunbyeol.png -->
        <img
          src="eunbyeol.png"
          class="profile-photo"
          alt="SOOP갓은별">

        <div class="profile-heart">♥</div>

      </div>

      <div class="staff-wrap">

        <div class="staff">
          <div class="staff-role">👑 회장님</div>
          <div class="staff-name">고집사</div>
        </div>

        <div class="staff">
          <div class="staff-role">💗 부회장님</div>
          <div class="staff-name">보노아조씨</div>
        </div>

      </div>

    </div>

  </div>


  <!-- 열혈 -->
  <div class="section" id="hotSection">

    <div class="section-header" onclick="toggleSection('hotSection')">
      <div class="section-title">🔥 열혈 등수</div>
      <div class="section-sub">눌러서 열혈 기록 보기</div>
    </div>

    <div class="section-content">

      <div class="hot-form">

        <input id="hotName" placeholder="열혈 이름">

        <div class="input-unit">
          <input
            id="hotCount"
            type="text"
            inputmode="numeric"
            placeholder="기여 개수">
          <span>개</span>
        </div>

        <button class="add" id="hotAddButton">
          ＋ 추가
        </button>

      </div>

      <div class="tip">
        같은 이름을 다시 입력하면 기존 기여 개수에 자동으로 더해져요.
      </div>

      <div id="hotList"></div>

    </div>
  </div>


  <!-- 쿠폰 -->
  <div class="section" id="couponSection">

    <div class="section-header" onclick="toggleSection('couponSection')">
      <div class="section-title">🎟️ 쿠폰</div>
      <div class="section-sub">눌러서 구매자별 쿠폰 보기</div>
    </div>

    <div class="section-content">

      <div class="form">

        <input id="buyer" placeholder="구매한 이름">

        <input id="product" placeholder="구매한 항목">

        <input
          id="count"
          type="number"
          min="1"
          value="1"
          placeholder="개수">

        <button class="add" id="addButton">
          ＋ 기록 추가
        </button>

      </div>

      <div class="stats">

        <div class="stat">
          <span>구매자</span>
          <strong id="peopleCount">0명</strong>
        </div>

        <div class="stat">
          <span>쿠폰 항목</span>
          <strong id="itemCount">0개</strong>
        </div>

        <div class="stat">
          <span>전체 수량</span>
          <strong id="totalCount">0개</strong>
        </div>

      </div>

      <div class="tip">
        구매자를 누르면 쿠폰이 펼쳐져요. ☰를 잡고 순서를 바꿀 수 있어요.
      </div>

      <div id="buyerList"></div>

    </div>
  </div>

</div>


<script>

/* ========================
   공통
======================== */

function toggleSection(id){
  document.getElementById(id).classList.toggle("open");
}

function onlyDigits(value){
  return String(value||"").replace(/[^\d]/g,"");
}

function formatNumber(value){

  var digits=onlyDigits(value);

  if(!digits)return "";

  return Number(digits).toLocaleString("ko-KR");
}

function parseNumber(value){

  var digits=onlyDigits(value);

  if(!digits)return 0;

  return parseInt(digits,10)||0;
}

function attachCommaInput(input){

  input.addEventListener("input",function(){
    input.value=formatNumber(input.value);
  });
}


/* ========================
   데이터 불러오기
======================== */

var records={
  items:[],
  people:{},
  order:[],
  itemOrders:{}
};

var hotRecords=[];

try{

  var saved=localStorage.getItem("buyerTracker");

  if(saved){

    var loaded=JSON.parse(saved);

    records.items=loaded.items||[];
    records.people=loaded.people||{};
    records.order=loaded.order||Object.keys(records.people);
    records.itemOrders=loaded.itemOrders||{};
  }

}catch(e){}

try{

  var hotSaved=localStorage.getItem("hotRankTracker");

  if(hotSaved){
    hotRecords=JSON.parse(hotSaved)||[];
  }

}catch(e){}


function saveCoupons(){
  localStorage.setItem(
    "buyerTracker",
    JSON.stringify(records)
  );
}

function saveHot(){
  localStorage.setItem(
    "hotRankTracker",
    JSON.stringify(hotRecords)
  );
}


/* ========================
   드래그
======================== */

function makeSortable(
  container,
  handleSelector,
  itemSelector,
  callback
){

  var dragged=null;

  container.onpointerdown=function(e){

    var handle=e.target.closest(handleSelector);

    if(!handle)return;

    var item=handle.closest(itemSelector);

    if(!item)return;

    dragged=item;

    dragged.classList.add("dragging");

    try{
      handle.setPointerCapture(e.pointerId);
    }catch(err){}

    e.preventDefault();
    e.stopPropagation();
  };


  container.onpointermove=function(e){

    if(!dragged)return;

    var others=
      Array.from(container.children)
      .filter(function(el){
        return el.matches(itemSelector)&&el!==dragged;
      });

    var target=null;

    for(var i=0;i<others.length;i++){

      var rect=others[i].getBoundingClientRect();

      if(e.clientY<rect.top+rect.height/2){
        target=others[i];
        break;
      }
    }

    if(target){
      container.insertBefore(dragged,target);
    }else{
      container.appendChild(dragged);
    }
  };


  function finish(){

    if(!dragged)return;

    dragged.classList.remove("dragging");

    dragged=null;

    callback();
  }

  container.onpointerup=finish;
  container.onpointercancel=finish;
}


/* ========================
   열혈
======================== */

function addHot(){

  var name=
    document.getElementById("hotName")
    .value.trim();

  var count=
    parseNumber(
      document.getElementById("hotCount").value
    );


  if(!name){

    alert("열혈 이름을 입력해주세요.");

    return;
  }


  if(count<1){

    alert("기여 개수를 입력해주세요.");

    return;
  }


  var existing=
    hotRecords.find(function(person){

      return person.name===name;

    });


  /* 같은 이름이면 자동 누적 */

  if(existing){

    existing.contribution=
      Number(existing.contribution||0)+count;

  }else{

    hotRecords.push({

      id:
        Date.now().toString()+
        Math.random().toString(),

      name:name,

      contribution:count

    });

  }


  saveHot();


  document.getElementById("hotName").value="";

  document.getElementById("hotCount").value="";


  drawHot();
}


/* 기여 개수 직접 수정 */

function adjustHot(id){

  var person=
    hotRecords.find(function(p){
      return p.id===id;
    });


  if(!person)return;


  var value=
    prompt(
      "기여 개수를 직접 수정해주세요.",
      Number(person.contribution||0)
      .toLocaleString("ko-KR")
    );


  if(value===null)return;


  person.contribution=
    parseNumber(value);


  saveHot();

  drawHot();
}


/* 열혈 삭제 */

function deleteHot(id){

  var person=
    hotRecords.find(function(p){
      return p.id===id;
    });


  if(!person)return;


  if(confirm(person.name+"님을 삭제할까요?")){


    hotRecords=
      hotRecords.filter(function(p){

        return p.id!==id;

      });


    saveHot();

    drawHot();

  }
}


/* 열혈 화면 */

function drawHot(){

  var list=
    document.getElementById("hotList");


  if(hotRecords.length===0){

    list.innerHTML=
      '<div class="empty">아직 열혈 기록이 없어요.</div>';

    return;
  }


  list.innerHTML="";


  hotRecords.forEach(function(person,index){


    var card=document.createElement("div");

    card.className="hot-card";

    card.dataset.id=person.id;


    var header=document.createElement("div");

    header.className="hot-header";


    var main=document.createElement("div");

    main.className="hot-main";


    var rank=document.createElement("div");

    rank.className="rank";

    rank.textContent=(index+1)+"위";


    var info=document.createElement("div");


    var name=document.createElement("div");

    name.className="name";

    name.textContent=person.name;


    info.appendChild(name);


    main.appendChild(rank);

    main.appendChild(info);


    var tools=document.createElement("div");

    tools.className="hot-tools";


    /* 자물쇠 */

    var lock=document.createElement("button");

    lock.className="icon-btn";

    lock.textContent="🔒";


    lock.onclick=function(e){

      e.stopPropagation();


      card.classList.toggle("secret-open");


      lock.textContent=
        card.classList.contains("secret-open")
        ?"🔓"
        :"🔒";

    };


    /* 휴지통 */

    var trash=document.createElement("button");

    trash.className="icon-btn trash-btn";

    trash.textContent="🗑️";


    trash.onclick=function(e){

      e.stopPropagation();

      deleteHot(person.id);

    };


    /* 순서 변경 */

    var handle=document.createElement("div");

    handle.className="drag-handle";

    handle.textContent="☰";


    tools.appendChild(lock);

    tools.appendChild(trash);

    tools.appendChild(handle);


    header.appendChild(main);

    header.appendChild(tools);


    /* 숨겨진 기여 개수 */

    var secret=document.createElement("div");

    secret.className="hot-secret";


    var secretBox=document.createElement("div");

    secretBox.className="secret-box";


    var secretLabel=document.createElement("div");

    secretLabel.className="secret-label";

    secretLabel.textContent="기여 개수";


    var secretNumber=document.createElement("div");

    secretNumber.className="secret-number";

    secretNumber.textContent=
      Number(person.contribution||0)
      .toLocaleString("ko-KR")+"개";


    var adjustButton=document.createElement("button");

    adjustButton.className="adjust-btn";

    adjustButton.textContent="기여 개수 직접 수정";


    adjustButton.onclick=function(){

      adjustHot(person.id);

    };


    secretBox.appendChild(secretLabel);

    secretBox.appendChild(secretNumber);

    secretBox.appendChild(adjustButton);


    secret.appendChild(secretBox);


    card.appendChild(header);

    card.appendChild(secret);


    list.appendChild(card);

  });


  /* 열혈 순서 변경 */

  makeSortable(

    list,

    ".drag-handle",

    ".hot-card",

    function(){


      var ids=
        Array.from(
          list.querySelectorAll(".hot-card")
        ).map(function(card){

          return card.dataset.id;

        });


      hotRecords.sort(function(a,b){

        return ids.indexOf(a.id)-ids.indexOf(b.id);

      });


      saveHot();

      drawHot();

    }

  );

}


/* ========================
   쿠폰
======================== */

function normalizeCoupons(){

  records.order=
    records.order.filter(function(name){

      return records.people[name];

    });


  Object.keys(records.people)
  .forEach(function(name){


    if(records.order.indexOf(name)===-1){

      records.order.push(name);

    }


    if(!records.itemOrders[name]){

      records.itemOrders[name]=
        Object.keys(records.people[name]);

    }


    records.itemOrders[name]=
      records.itemOrders[name]
      .filter(function(product){

        return records.people[name][product]!==undefined;

      });


    Object.keys(records.people[name])
    .forEach(function(product){


      if(
        records.itemOrders[name]
        .indexOf(product)===-1
      ){

        records.itemOrders[name].push(product);

      }

    });

  });

}


/* 쿠폰 추가 */

function addRecord(){

  var buyer=
    document.getElementById("buyer")
    .value.trim();

  var product=
    document.getElementById("product")
    .value.trim();

  var count=
    parseInt(
      document.getElementById("count").value
    );


  if(!buyer){

    alert("구매한 이름을 입력해주세요.");

    return;

  }


  if(!product){

    alert("구매한 항목을 입력해주세요.");

    return;

  }


  if(!count||count<1){

    alert("개수를 입력해주세요.");

    return;

  }


  if(!records.people[buyer]){

    records.people[buyer]={};

    records.order.push(buyer);

    records.itemOrders[buyer]=[];

  }


  if(
    records.people[buyer][product]===undefined
  ){

    records.people[buyer][product]=0;

    records.itemOrders[buyer].push(product);

  }


  records.people[buyer][product]+=count;


  saveCoupons();


  document.getElementById("buyer").value="";

  document.getElementById("product").value="";

  document.getElementById("count").value="1";


  drawBuyers();

}


/* 구매자 이름 수정 */

function renameBuyer(oldName){

  var newName=
    prompt(
      "새 이름을 입력해주세요.",
      oldName
    );


  if(newName===null)return;


  newName=newName.trim();


  if(!newName||newName===oldName)return;


  if(records.people[newName]){

    alert("이미 같은 이름의 구매자가 있어요.");

    return;

  }


  records.people[newName]=
    records.people[oldName];


  delete records.people[oldName];


  records.itemOrders[newName]=
    records.itemOrders[oldName]||[];


  delete records.itemOrders[oldName];


  var index=
    records.order.indexOf(oldName);


  if(index!==-1){

    records.order[index]=newName;

  }


  saveCoupons();

  drawBuyers();

}


/* 쿠폰 수량 변경 */

function changeQty(
  buyer,
  product,
  value
){

  var number=parseInt(value);


  if(isNaN(number)||number<0){

    number=0;

  }


  if(number===0){


    delete records.people[buyer][product];


    records.itemOrders[buyer]=
      records.itemOrders[buyer]
      .filter(function(p){

        return p!==product;

      });


  }else{

    records.people[buyer][product]=number;

  }


  saveCoupons();

  drawBuyers();

}


/* 쿠폰 항목 삭제 */

function deleteItem(
  buyer,
  product
){

  if(confirm(product+" 항목을 삭제할까요?")){


    delete records.people[buyer][product];


    records.itemOrders[buyer]=
      records.itemOrders[buyer]
      .filter(function(p){

        return p!==product;

      });


    saveCoupons();

    drawBuyers();

  }

}


/* 구매자 삭제 */

function deleteBuyer(buyer){

  if(confirm(buyer+"님의 기록을 삭제할까요?")){


    delete records.people[buyer];

    delete records.itemOrders[buyer];


    records.order=
      records.order.filter(function(name){

        return name!==buyer;

      });


    saveCoupons();

    drawBuyers();

  }

}


/* 쿠폰 통계 */

function updateStats(){

  var buyers=
    Object.keys(records.people);

  var items={};

  var total=0;


  buyers.forEach(function(buyer){


    Object.keys(records.people[buyer])
    .forEach(function(product){


      items[product]=true;


      total+=
        records.people[buyer][product]||0;

    });

  });


  document.getElementById("peopleCount")
  .textContent=
    buyers.length+"명";


  document.getElementById("itemCount")
  .textContent=
    Object.keys(items).length+"개";


  document.getElementById("totalCount")
  .textContent=
    total+"개";

}


/* 쿠폰 화면 */

function drawBuyers(){

  normalizeCoupons();

  updateStats();


  var list=
    document.getElementById("buyerList");


  if(records.order.length===0){

    list.innerHTML=
      '<div class="empty">아직 쿠폰 기록이 없어요.</div>';

    return;

  }


  list.innerHTML="";


  records.order.forEach(function(buyer){


    var data=
      records.people[buyer];


    var products=
      records.itemOrders[buyer]||[];


    var total=0;


    products.forEach(function(product){

      total+=data[product]||0;

    });


    var card=
      document.createElement("div");


    card.className="buyer-card";

    card.dataset.buyer=buyer;


    var header=
      document.createElement("div");


    header.className="buyer-header";


    var main=
      document.createElement("div");


    main.className="buyer-main";


    var avatar=
      document.createElement("div");


    avatar.className="avatar";

    avatar.textContent="♥";


    var info=
      document.createElement("div");


    var name=
      document.createElement("div");


    name.className="name";

    name.textContent=buyer;


    var sub=
      document.createElement("div");


    sub.className="sub";

    sub.textContent="총 "+total+"개";


    info.appendChild(name);

    info.appendChild(sub);


    main.appendChild(avatar);

    main.appendChild(info);


    main.onclick=function(){

      card.classList.toggle("open");

    };


    var handle=
      document.createElement("div");


    handle.className="drag-handle";

    handle.textContent="☰";


    header.appendChild(main);

    header.appendChild(handle);


    var detail=
      document.createElement("div");


    detail.className="buyer-detail";


    var itemList=
      document.createElement("div");


    products.forEach(function(product){


      if(data[product]===undefined)return;


      var row=
        document.createElement("div");


      row.className="item-row";

      row.dataset.product=product;


      var itemHandle=
        document.createElement("div");


      itemHandle.className="item-handle";

      itemHandle.textContent="☰";


      var itemName=
        document.createElement("div");


      itemName.className="item-name";

      itemName.textContent=product;


      var qty=
        document.createElement("input");


      qty.type="number";

      qty.min="0";

      qty.className="qty";

      qty.value=data[product];


      qty.onchange=function(){

        changeQty(
          buyer,
          product,
          this.value
        );

      };


      var del=
        document.createElement("button");


      del.className="small-delete";

      del.textContent="삭제";


      del.onclick=function(){

        deleteItem(
          buyer,
          product
        );

      };


      row.appendChild(itemHandle);

      row.appendChild(itemName);

      row.appendChild(qty);

      row.appendChild(del);


      itemList.appendChild(row);

    });


    detail.appendChild(itemList);


    var actions=
      document.createElement("div");


    actions.className="actions";


    var rename=
      document.createElement("button");


    rename.className="edit-btn";

    rename.textContent="✎ 이름 수정";


    rename.onclick=function(){

      renameBuyer(buyer);

    };


    var deleteBtn=
      document.createElement("button");


    deleteBtn.className="danger-btn";

    deleteBtn.textContent="구매자 삭제";


    deleteBtn.onclick=function(){

      deleteBuyer(buyer);

    };


    actions.appendChild(rename);

    actions.appendChild(deleteBtn);


    detail.appendChild(actions);


    card.appendChild(header);

    card.appendChild(detail);


    list.appendChild(card);


    /* 쿠폰 항목 순서 변경 */

    makeSortable(

      itemList,

      ".item-handle",

      ".item-row",

      function(){


        records.itemOrders[buyer]=
          Array.from(
            itemList.querySelectorAll(".item-row")
          ).map(function(row){

            return row.dataset.product;

          });


        saveCoupons();

      }

    );

  });


  /* 구매자 순서 변경 */

  makeSortable(

    list,

    ".drag-handle",

    ".buyer-card",

    function(){


      records.order=
        Array.from(
          list.querySelectorAll(".buyer-card")
        ).map(function(card){

          return card.dataset.buyer;

        });


      saveCoupons();

    }

  );

}


/* ========================
   시작
======================== */

attachCommaInput(
  document.getElementById("hotCount")
);


document.getElementById("hotAddButton")
.onclick=addHot;


document.getElementById("addButton")
.onclick=addRecord;


drawHot();

drawBuyers();

</script>
