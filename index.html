<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은별이방 쿠폰 기록</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px 14px 40px;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:#f5f5f5;
  background:
    radial-gradient(circle at top left,#282828 0,transparent 35%),
    radial-gradient(circle at top right,#1d1d1d 0,transparent 35%),
    linear-gradient(180deg,#0f0f10 0%,#151516 55%,#0c0c0d 100%);
}

.container{
  max-width:900px;
  margin:auto;
}

.hero{
  position:relative;
  overflow:hidden;
  padding:28px 22px;
  margin-bottom:18px;
  border:1px solid #363636;
  border-radius:28px;
  color:white;
  background:linear-gradient(135deg,#171717,#262626 55%,#383838);
  box-shadow:0 16px 40px rgba(0,0,0,.45);
}

.hero:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  top:-90px;
  right:-45px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
}

.hero h1{
  position:relative;
  z-index:1;
  margin:0 0 7px;
  font-size:27px;
  letter-spacing:-.5px;
}

.hero p{
  position:relative;
  z-index:1;
  margin:0;
  color:#bdbdbd;
  font-size:14px;
}

.card{
  padding:18px;
  margin-bottom:16px;
  border:1px solid #303030;
  border-radius:22px;
  background:rgba(24,24,25,.96);
  box-shadow:0 10px 30px rgba(0,0,0,.28);
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr 110px 145px;
  gap:10px;
}

input{
  width:100%;
  padding:14px;
  border:1.5px solid #3a3a3a;
  border-radius:14px;
  outline:none;
  color:#fff;
  background:#111112;
  font-size:16px;
}

input::placeholder{
  color:#777;
}

input:focus{
  border-color:#8b8b8b;
  box-shadow:0 0 0 4px rgba(255,255,255,.06);
}

button{
  font-family:inherit;
  cursor:pointer;
}

.add{
  min-height:48px;
  border:1px solid #555;
  border-radius:14px;
  color:#111;
  background:linear-gradient(135deg,#fff,#d7d7d7);
  font-size:16px;
  font-weight:900;
  box-shadow:0 8px 20px rgba(255,255,255,.08);
}

.add:active{
  transform:scale(.98);
}

.tip{
  margin-top:10px;
  color:#858585;
  font-size:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}

.stat{
  padding:15px 6px;
  border:1px solid #303030;
  border-radius:18px;
  text-align:center;
  background:#19191a;
}

.stat:nth-child(1){
  background:linear-gradient(135deg,#1b1b1c,#272728);
}

.stat:nth-child(2){
  background:linear-gradient(135deg,#171718,#303031);
}

.stat:nth-child(3){
  background:linear-gradient(135deg,#202021,#3a3a3b);
}

.stat span{
  display:block;
  margin-bottom:5px;
  color:#8f8f8f;
  font-size:12px;
}

.stat strong{
  color:#f7f7f7;
  font-size:21px;
}

.section-title{
  margin-bottom:13px;
  color:#f5f5f5;
  font-size:17px;
}

.buyer-card{
  margin-bottom:11px;
  overflow:hidden;
  border:1px solid #333;
  border-radius:18px;
  background:#151516;
  transition:transform .15s,box-shadow .15s;
}

.buyer-card.dragging{
  opacity:.6;
  transform:scale(1.015);
  box-shadow:0 15px 30px rgba(0,0,0,.55);
}

.buyer-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px;
  background:linear-gradient(135deg,#1b1b1c,#242425);
}

.buyer-main{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  cursor:pointer;
}

.avatar{
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  flex:none;
  border:1px solid #545454;
  border-radius:50%;
  color:#111;
  background:linear-gradient(135deg,#ffffff,#bfbfbf);
  font-size:17px;
}

.buyer-name{
  color:#fff;
  font-size:16px;
  font-weight:850;
}

.buyer-total{
  margin-top:3px;
  color:#8e8e8e;
  font-size:12px;
}

.drag-handle{
  display:flex;
  align-items:center;
  justify-content:center;
  width:40px;
  height:40px;
  flex:none;
  border:1px solid #3c3c3c;
  border-radius:11px;
  color:#aaa;
  background:#111112;
  font-size:21px;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.drag-handle:active{
  color:#fff;
  background:#303030;
  cursor:grabbing;
}

.buyer-detail{
  display:none;
  padding:12px 14px 14px;
  border-top:1px solid #2c2c2c;
  background:#111112;
}

.buyer-card.open .buyer-detail{
  display:block;
}

.item-row{
  display:grid;
  grid-template-columns:38px 1fr 82px 65px;
  gap:7px;
  align-items:center;
  padding:9px 3px;
  border-bottom:1px solid #292929;
}

.item-row:last-child{
  border-bottom:none;
}

.item-row.dragging{
  opacity:.55;
  border-radius:12px;
  background:#282829;
}

.item-handle{
  display:flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  border:1px solid #393939;
  border-radius:9px;
  color:#8d8d8d;
  background:#19191a;
  font-size:18px;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.item-name{
  overflow:hidden;
  color:#ddd;
  font-weight:700;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.qty{
  padding:9px 5px;
  border:1px solid #3b3b3b;
  border-radius:10px;
  text-align:center;
  background:#181819;
}

.item-delete{
  padding:9px 5px;
  border:1px solid #483333;
  border-radius:10px;
  color:#d98b8b;
  background:#241919;
  font-size:12px;
  font-weight:800;
}

.buyer-delete{
  margin-top:12px;
  padding:10px 12px;
  border:1px solid #3a3a3a;
  border-radius:11px;
  color:#9d9d9d;
  background:#1c1c1d;
  font-weight:700;
}

.empty{
  padding:38px 20px;
  color:#777;
  text-align:center;
}

.reset{
  padding:11px 14px;
  border:1px solid #353535;
  border-radius:12px;
  color:#858585;
  background:#181819;
  font-weight:700;
}

@media(max-width:760px){
  .form{
    grid-template-columns:1fr 1fr;
  }

  .add{
    grid-column:1/-1;
  }

  .item-row{
    grid-template-columns:34px 1fr 70px 58px;
    gap:5px;
  }

  .hero h1{
    font-size:24px;
  }

  .stat{
    padding:12px 4px;
  }

  .stat strong{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1>🖤 은별이방 쿠폰 기록</h1>
    <p>구매자를 누르면 보유 쿠폰을 확인할 수 있어요.</p>
  </div>

  <div class="card">

    <div class="form">

      <input id="buyer" placeholder="구매한 이름">

      <input id="product" placeholder="구매한 항목">

      <input
        id="count"
        type="number"
        min="1"
        value="1"
        placeholder="개수">

      <button id="addButton" class="add">
        ＋ 기록 추가
      </button>

    </div>

    <div class="tip">
      ☰를 잡고 드래그하면 구매자와 쿠폰 항목의 순서를 바꿀 수 있어요.
    </div>

  </div>

  <div class="stats">

    <div class="stat">
      <span>구매자</span>
      <strong id="peopleCount">0명</strong>
    </div>

    <div class="stat">
      <span>쿠폰 항목</span>
      <strong id="itemCount">0개</strong>
    </div>

    <div class="stat">
      <span>전체 수량</span>
      <strong id="totalCount">0개</strong>
    </div>

  </div>

  <div class="card">

    <div class="section-title">
      <b>구매자별 쿠폰 기록</b>
    </div>

    <div id="buyerList"></div>

  </div>

  <button id="resetButton" class="reset">
    전체 기록 삭제
  </button>

</div>

<script>
var records = {
  items: [],
  people: {},
  order: [],
  itemOrders: {}
};

try {
  var saved = localStorage.getItem("buyerTracker");

  if(saved){
    var loaded = JSON.parse(saved);

    records.items = loaded.items || [];
    records.people = loaded.people || {};
    records.order = loaded.order || Object.keys(records.people);
    records.itemOrders = loaded.itemOrders || {};
  }
}catch(e){}

function save(){
  localStorage.setItem(
    "buyerTracker",
    JSON.stringify(records)
  );
}

function normalizeOrders(){

  records.order = records.order.filter(function(name){
    return records.people[name];
  });

  Object.keys(records.people).forEach(function(name){

    if(records.order.indexOf(name) === -1){
      records.order.push(name);
    }

    if(!records.itemOrders[name]){
      records.itemOrders[name] =
        Object.keys(records.people[name]);
    }

    records.itemOrders[name] =
      records.itemOrders[name].filter(function(product){
        return records.people[name][product] !== undefined;
      });

    Object.keys(records.people[name]).forEach(function(product){

      if(records.itemOrders[name].indexOf(product) === -1){
        records.itemOrders[name].push(product);
      }

    });

  });
}

function addRecord(){

  var buyer =
    document.getElementById("buyer").value.trim();

  var product =
    document.getElementById("product").value.trim();

  var count =
    parseInt(document.getElementById("count").value);

  if(!buyer){
    alert("구매한 이름을 입력해주세요.");
    return;
  }

  if(!product){
    alert("구매한 항목을 입력해주세요.");
    return;
  }

  if(!count || count < 1){
    alert("개수를 입력해주세요.");
    return;
  }

  if(!records.people[buyer]){
    records.people[buyer] = {};
    records.order.push(buyer);
    records.itemOrders[buyer] = [];
  }

  if(records.people[buyer][product] === undefined){

    records.people[buyer][product] = 0;

    if(!records.itemOrders[buyer]){
      records.itemOrders[buyer] = [];
    }

    records.itemOrders[buyer].push(product);
  }

  records.people[buyer][product] += count;

  if(records.items.indexOf(product) === -1){
    records.items.push(product);
  }

  save();

  document.getElementById("buyer").value = "";
  document.getElementById("product").value = "";
  document.getElementById("count").value = "1";

  drawBuyers();
}

function changeQty(buyer, product, value){

  var number = parseInt(value);

  if(isNaN(number) || number < 0){
    number = 0;
  }

  if(number === 0){

    delete records.people[buyer][product];

    records.itemOrders[buyer] =
      records.itemOrders[buyer].filter(function(p){
        return p !== product;
      });

  }else{
    records.people[buyer][product] = number;
  }

  save();
  drawBuyers();
}

function deleteItem(buyer, product){

  if(confirm(product + " 항목을 삭제할까요?")){

    delete records.people[buyer][product];

    records.itemOrders[buyer] =
      records.itemOrders[buyer].filter(function(p){
        return p !== product;
      });

    save();
    drawBuyers();
  }
}

function deleteBuyer(buyer){

  if(confirm(buyer + "님의 모든 기록을 삭제할까요?")){

    delete records.people[buyer];
    delete records.itemOrders[buyer];

    records.order =
      records.order.filter(function(name){
        return name !== buyer;
      });

    save();
    drawBuyers();
  }
}

function updateStats(){

  var buyers = Object.keys(records.people);
  var usedItems = {};
  var total = 0;

  buyers.forEach(function(buyer){

    Object.keys(records.people[buyer]).forEach(function(product){

      usedItems[product] = true;

      total +=
        records.people[buyer][product] || 0;

    });

  });

  document.getElementById("peopleCount").textContent =
    buyers.length + "명";

  document.getElementById("itemCount").textContent =
    Object.keys(usedItems).length + "개";

  document.getElementById("totalCount").textContent =
    total + "개";
}

function makeSortable(
  container,
  handleSelector,
  itemSelector,
  onChange
){

  var dragged = null;
  var activeHandle = null;
  var pointerId = null;

  container.addEventListener("pointerdown", function(e){

    var handle =
      e.target.closest(handleSelector);

    if(!handle) return;

    var item =
      handle.closest(itemSelector);

    if(!item) return;

    dragged = item;
    activeHandle = handle;
    pointerId = e.pointerId;

    try{
      activeHandle.setPointerCapture(pointerId);
    }catch(err){}

    dragged.classList.add("dragging");

    e.preventDefault();
    e.stopPropagation();
  });

  container.addEventListener("pointermove", function(e){

    if(!dragged) return;

    var elements =
      Array.from(container.children).filter(function(el){

        return (
          el.matches(itemSelector) &&
          el !== dragged
        );

      });

    var target = null;

    for(var i = 0; i < elements.length; i++){

      var rect =
        elements[i].getBoundingClientRect();

      if(e.clientY < rect.top + rect.height / 2){
        target = elements[i];
        break;
      }

    }

    if(target){
      container.insertBefore(dragged, target);
    }else{
      container.appendChild(dragged);
    }
  });

  function finish(){

    if(!dragged) return;

    dragged.classList.remove("dragging");

    if(activeHandle && pointerId !== null){
      try{
        activeHandle.releasePointerCapture(pointerId);
      }catch(err){}
    }

    dragged = null;
    activeHandle = null;
    pointerId = null;

    onChange();
  }

  container.addEventListener("pointerup", finish);
  container.addEventListener("pointercancel", finish);
}

function drawBuyers(){

  normalizeOrders();
  updateStats();

  var list =
    document.getElementById("buyerList");

  if(records.order.length === 0){

    list.innerHTML =
      '<div class="empty">' +
      '아직 쿠폰 기록이 없어요.' +
      '</div>';

    return;
  }

  list.innerHTML = "";

  records.order.forEach(function(buyer){

    var buyerData =
      records.people[buyer];

    var products =
      records.itemOrders[buyer] || [];

    var total = 0;

    products.forEach(function(product){

      total +=
        buyerData[product] || 0;

    });

    var card =
      document.createElement("div");

    card.className = "buyer-card";
    card.dataset.buyer = buyer;

    var header =
      document.createElement("div");

    header.className = "buyer-header";

    var main =
      document.createElement("div");

    main.className = "buyer-main";

    var avatar =
      document.createElement("div");

    avatar.className = "avatar";
    avatar.textContent = "★";

    var info =
      document.createElement("div");

    var name =
      document.createElement("div");

    name.className = "buyer-name";
    name.textContent = buyer;

    var totalText =
      document.createElement("div");

    totalText.className = "buyer-total";
    totalText.textContent =
      "총 " + total + "개";

    info.appendChild(name);
    info.appendChild(totalText);

    main.appendChild(avatar);
    main.appendChild(info);

    main.onclick = function(){
      card.classList.toggle("open");
    };

    var handle =
      document.createElement("div");

    handle.className = "drag-handle";
    handle.textContent = "☰";
    handle.title = "드래그해서 순서 변경";

    header.appendChild(main);
    header.appendChild(handle);

    var detail =
      document.createElement("div");

    detail.className = "buyer-detail";

    var itemList =
      document.createElement("div");

    itemList.className = "item-list";

    products.forEach(function(product){

      if(buyerData[product] === undefined){
        return;
      }

      var row =
        document.createElement("div");

      row.className = "item-row";
      row.dataset.product = product;

      var itemHandle =
        document.createElement("div");

      itemHandle.className = "item-handle";
      itemHandle.textContent = "☰";

      var itemName =
        document.createElement("div");

      itemName.className = "item-name";
      itemName.textContent = product;

      var input =
        document.createElement("input");

      input.type = "number";
      input.min = "0";
      input.className = "qty";
      input.value = buyerData[product];

      input.onchange = function(){

        changeQty(
          buyer,
          product,
          this.value
        );

      };

      var del =
        document.createElement("button");

      del.className = "item-delete";
      del.textContent = "삭제";

      del.onclick = function(){

        deleteItem(
          buyer,
          product
        );

      };

      row.appendChild(itemHandle);
      row.appendChild(itemName);
      row.appendChild(input);
      row.appendChild(del);

      itemList.appendChild(row);

    });

    detail.appendChild(itemList);

    var buyerDelete =
      document.createElement("button");

    buyerDelete.className =
      "buyer-delete";

    buyerDelete.textContent =
      "구매자 전체 삭제";

    buyerDelete.onclick = function(){
      deleteBuyer(buyer);
    };

    detail.appendChild(buyerDelete);

    card.appendChild(header);
    card.appendChild(detail);

    list.appendChild(card);

    makeSortable(
      itemList,
      ".item-handle",
      ".item-row",
      function(){

        records.itemOrders[buyer] =
          Array.from(
            itemList.querySelectorAll(".item-row")
          ).map(function(row){

            return row.dataset.product;

          });

        save();
      }
    );

  });

  makeSortable(
    list,
    ".drag-handle",
    ".buyer-card",
    function(){

      records.order =
        Array.from(
          list.querySelectorAll(".buyer-card")
        ).map(function(card){

          return card.dataset.buyer;

        });

      save();
    }
  );
}

document.getElementById("addButton")
.onclick = addRecord;

document.getElementById("resetButton")
.onclick = function(){

  if(confirm("모든 쿠폰 기록을 삭제할까요?")){

    records = {
      items: [],
      people: {},
      order: [],
      itemOrders: {}
    };

    save();
    drawBuyers();
  }
};

drawBuyers();

</script>

</body>
</html>
