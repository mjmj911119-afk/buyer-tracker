<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은별이방 쿠폰 기록</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px 14px 40px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:#5b3b4b;
  min-height:100vh;
  background:
    radial-gradient(circle at top left,#ffe2ef 0,transparent 35%),
    radial-gradient(circle at top right,#eee5ff 0,transparent 32%),
    linear-gradient(180deg,#fff9fc 0%,#fff0f6 55%,#faf3ff 100%);
}

.container{
  max-width:900px;
  margin:auto;
}

.hero{
  position:relative;
  overflow:hidden;
  padding:28px 22px;
  margin-bottom:18px;
  border-radius:28px;
  color:white;
  background:linear-gradient(135deg,#ff8eb9 0%,#f7a2c9 50%,#be9dff 100%);
  box-shadow:0 14px 35px rgba(225,110,165,.24);
}

.hero:before{
  content:"";
  position:absolute;
  width:170px;
  height:170px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  top:-75px;
  right:-45px;
}

.hero h1{
  position:relative;
  margin:0 0 7px;
  font-size:27px;
  z-index:1;
}

.hero p{
  position:relative;
  margin:0;
  font-size:14px;
  opacity:.95;
  z-index:1;
}

.card{
  padding:18px;
  margin-bottom:16px;
  border-radius:22px;
  background:rgba(255,255,255,.95);
  border:1px solid #f3d5e2;
  box-shadow:0 10px 28px rgba(210,120,160,.10);
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr 110px 145px;
  gap:10px;
}

input{
  width:100%;
  padding:14px 15px;
  border:1.5px solid #f1cede;
  border-radius:14px;
  background:#fffafd;
  color:#654455;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#f08fba;
  box-shadow:0 0 0 4px rgba(240,143,186,.14);
}

button{
  cursor:pointer;
  font-family:inherit;
}

.add{
  border:0;
  border-radius:14px;
  color:white;
  font-size:16px;
  font-weight:800;
  background:linear-gradient(135deg,#ff7ead,#ef8fc6 55%,#ad91f5);
  box-shadow:0 8px 18px rgba(225,105,165,.24);
}

.tip{
  margin-top:10px;
  font-size:12px;
  color:#aa8195;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}

.stat{
  padding:15px;
  border-radius:18px;
  text-align:center;
  font-weight:700;
}

.stat:nth-child(1){
  background:linear-gradient(135deg,#ffe0ed,#ffcfe2);
}

.stat:nth-child(2){
  background:linear-gradient(135deg,#ffe8f6,#f6d9ef);
}

.stat:nth-child(3){
  background:linear-gradient(135deg,#eee6ff,#ddd3ff);
}

.stat span{
  display:block;
  margin-bottom:5px;
  font-size:12px;
  opacity:.65;
}

.stat strong{
  font-size:21px;
}

.section-title{
  margin-bottom:13px;
  font-size:17px;
}

.buyer-card{
  overflow:hidden;
  margin-bottom:11px;
  border:1px solid #f1d7e3;
  border-radius:18px;
  background:white;
  box-shadow:0 5px 15px rgba(200,120,155,.06);
}

.buyer-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  width:100%;
  padding:15px 16px;
  border:0;
  background:linear-gradient(135deg,#fff4f8,#fbf2ff);
  color:#6c4658;
  text-align:left;
}

.buyer-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffb4cf,#c9b1ff);
  color:white;
  font-size:18px;
}

.buyer-name{
  font-size:16px;
  font-weight:800;
}

.buyer-total{
  margin-top:2px;
  font-size:12px;
  color:#aa8094;
}

.arrow{
  font-size:18px;
  transition:.2s;
}

.buyer-card.open .arrow{
  transform:rotate(180deg);
}

.buyer-detail{
  display:none;
  padding:12px 14px 14px;
  background:#fff;
}

.buyer-card.open .buyer-detail{
  display:block;
}

.item-row{
  display:grid;
  grid-template-columns:1fr 90px 70px;
  gap:8px;
  align-items:center;
  padding:9px 4px;
  border-bottom:1px solid #f6e9ef;
}

.item-row:last-child{
  border-bottom:0;
}

.item-name{
  font-weight:700;
  color:#755064;
}

.qty{
  padding:9px 7px;
  text-align:center;
  border:1px solid #f0d4e1;
  border-radius:10px;
  background:#fffafd;
}

.item-delete{
  padding:9px 8px;
  border:0;
  border-radius:10px;
  background:#ffe6ef;
  color:#cf5f82;
  font-weight:800;
}

.buyer-actions{
  display:flex;
  justify-content:flex-end;
  margin-top:10px;
}

.buyer-delete{
  padding:10px 12px;
  border:0;
  border-radius:11px;
  background:#f2edf0;
  color:#9d7889;
  font-weight:700;
}

.empty{
  padding:36px 20px;
  border-radius:16px;
  text-align:center;
  color:#b18a9d;
  background:linear-gradient(180deg,#fffafd,#fff5f9);
}

.reset-wrap{
  text-align:right;
}

.reset{
  padding:11px 14px;
  border:0;
  border-radius:12px;
  background:#f3eaf0;
  color:#a1778b;
  font-weight:700;
}

@media(max-width:760px){
  .form{
    grid-template-columns:1fr 1fr;
  }

  .add{
    grid-column:1/-1;
    min-height:48px;
  }

  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  .stat{
    padding:12px 5px;
  }

  .stat strong{
    font-size:18px;
  }

  .item-row{
    grid-template-columns:1fr 75px 62px;
  }

  .hero h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="hero">
    <h1>🎀 은별이방 쿠폰 기록</h1>
    <p>구매자를 누르면 구매한 쿠폰을 확인할 수 있어요 ♡</p>
  </div>

  <div class="card">
    <div class="form">

      <input id="buyer" placeholder="구매한 이름">

      <input id="product" placeholder="구매한 항목">

      <input
        id="count"
        type="number"
        min="1"
        value="1"
        placeholder="개수">

      <button id="addButton" class="add">
        ＋ 기록 추가
      </button>

    </div>

    <div class="tip">
      같은 구매자 + 같은 항목을 추가하면 개수가 자동 합산돼요.
    </div>
  </div>

  <div class="stats">

    <div class="stat">
      <span>구매자</span>
      <strong id="peopleCount">0명</strong>
    </div>

    <div class="stat">
      <span>쿠폰 항목</span>
      <strong id="itemCount">0개</strong>
    </div>

    <div class="stat">
      <span>전체 수량</span>
      <strong id="totalCount">0개</strong>
    </div>

  </div>

  <div class="card">

    <div class="section-title">
      <b>🩷 구매자별 쿠폰 기록</b>
    </div>

    <div id="buyerList"></div>

  </div>

  <div class="reset-wrap">
    <button id="resetButton" class="reset">
      전체 기록 삭제
    </button>
  </div>

</div>

<script>
var records = {
  items: [],
  people: {}
};

try {
  var saved = localStorage.getItem("buyerTracker");

  if(saved) {
    records = JSON.parse(saved);
  }
} catch(e) {}

function save() {
  localStorage.setItem(
    "buyerTracker",
    JSON.stringify(records)
  );
}

function addRecord() {
  var buyer =
    document.getElementById("buyer").value.trim();

  var product =
    document.getElementById("product").value.trim();

  var count =
    parseInt(document.getElementById("count").value);

  if(buyer === "") {
    alert("구매한 이름을 입력해주세요.");
    return;
  }

  if(product === "") {
    alert("구매한 항목을 입력해주세요.");
    return;
  }

  if(!count || count < 1) {
    alert("개수를 입력해주세요.");
    return;
  }

  if(records.items.indexOf(product) === -1) {
    records.items.push(product);
  }

  if(!records.people[buyer]) {
    records.people[buyer] = {};
  }

  if(!records.people[buyer][product]) {
    records.people[buyer][product] = 0;
  }

  records.people[buyer][product] += count;

  save();

  document.getElementById("buyer").value = "";
  document.getElementById("product").value = "";
  document.getElementById("count").value = "1";

  drawBuyers();
}

function changeQty(buyer, product, value) {
  var number = parseInt(value);

  if(isNaN(number) || number < 0) {
    number = 0;
  }

  records.people[buyer][product] = number;

  if(number === 0) {
    delete records.people[buyer][product];
  }

  save();
  drawBuyers();
}

function deleteItem(buyer, product) {
  if(confirm(product + " 항목을 삭제할까요?")) {
    delete records.people[buyer][product];
    save();
    drawBuyers();
  }
}

function deleteBuyer(buyer) {
  if(confirm(buyer + "님의 모든 기록을 삭제할까요?")) {
    delete records.people[buyer];
    save();
    drawBuyers();
  }
}

function updateStats() {
  var buyers = Object.keys(records.people);

  document.getElementById("peopleCount").textContent =
    buyers.length + "명";

  var usedItems = {};

  var grandTotal = 0;

  buyers.forEach(function(buyer) {
    Object.keys(records.people[buyer]).forEach(function(product) {
      usedItems[product] = true;
      grandTotal += records.people[buyer][product] || 0;
    });
  });

  document.getElementById("itemCount").textContent =
    Object.keys(usedItems).length + "개";

  document.getElementById("totalCount").textContent =
    grandTotal + "개";
}

function drawBuyers() {
  var list = document.getElementById("buyerList");
  var buyers = Object.keys(records.people);

  updateStats();

  if(buyers.length === 0) {
    list.innerHTML =
      '<div class="empty">' +
      '🎀 아직 쿠폰 기록이 없어요.<br>' +
      '위에서 구매자를 추가해주세요!' +
      '</div>';

    return;
  }

  list.innerHTML = "";

  buyers.forEach(function(buyer) {
    var buyerData = records.people[buyer];
    var products = Object.keys(buyerData);

    var total = 0;

    products.forEach(function(product) {
      total += buyerData[product] || 0;
    });

    var card = document.createElement("div");
    card.className = "buyer-card";

    var header = document.createElement("button");
    header.className = "buyer-header";

    header.innerHTML =
      '<div class="buyer-left">' +
        '<div class="avatar">🎀</div>' +
        '<div>' +
          '<div class="buyer-name">' + buyer + '</div>' +
          '<div class="buyer-total">총 ' + total + '개</div>' +
        '</div>' +
      '</div>' +
      '<div class="arrow">⌄</div>';

    var detail = document.createElement("div");
    detail.className = "buyer-detail";

    products.forEach(function(product) {
      var row = document.createElement("div");
      row.className = "item-row";

      var name = document.createElement("div");
      name.className = "item-name";
      name.textContent = product;

      var input = document.createElement("input");
      input.type = "number";
      input.min = "0";
      input.className = "qty";
      input.value = buyerData[product];

      input.onchange = function() {
        changeQty(
          buyer,
          product,
          this.value
        );
      };

      var del = document.createElement("button");
      del.className = "item-delete";
      del.textContent = "삭제";

      del.onclick = function() {
        deleteItem(buyer, product);
      };

      row.appendChild(name);
      row.appendChild(input);
      row.appendChild(del);

      detail.appendChild(row);
    });

    var actions = document.createElement("div");
    actions.className = "buyer-actions";

    var buyerDelete = document.createElement("button");
    buyerDelete.className = "buyer-delete";
    buyerDelete.textContent = "구매자 전체 삭제";

    buyerDelete.onclick = function() {
      deleteBuyer(buyer);
    };

    actions.appendChild(buyerDelete);
    detail.appendChild(actions);

    header.onclick = function() {
      card.classList.toggle("open");
    };

    card.appendChild(header);
    card.appendChild(detail);

    list.appendChild(card);
  });
}

document.getElementById("addButton").onclick = addRecord;

document.getElementById("resetButton").onclick = function() {
  if(confirm("모든 쿠폰 기록을 삭제할까요?")) {
    records = {
      items: [],
      people: {}
    };

    save();
    drawBuyers();
  }
};

drawBuyers();
</script>

</body>
</html>
