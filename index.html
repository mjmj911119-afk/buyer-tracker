<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>은별이방 쿠폰 기록</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px 14px 40px;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color:#5b3b4b;
  min-height:100vh;
  background:
    radial-gradient(circle at top left,#ffe2ef 0,transparent 35%),
    radial-gradient(circle at top right,#eee5ff 0,transparent 32%),
    linear-gradient(180deg,#fff9fc 0%,#fff0f6 55%,#faf3ff 100%);
}

.container{
  max-width:900px;
  margin:auto;
}

.hero{
  padding:28px 22px;
  margin-bottom:18px;
  border-radius:28px;
  color:white;
  background:linear-gradient(135deg,#ff8eb9 0%,#f7a2c9 50%,#be9dff 100%);
  box-shadow:0 14px 35px rgba(225,110,165,.24);
}

.hero h1{
  margin:0 0 7px;
  font-size:27px;
}

.hero p{
  margin:0;
  font-size:14px;
}

.card{
  padding:18px;
  margin-bottom:16px;
  border-radius:22px;
  background:white;
  border:1px solid #f3d5e2;
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr 110px 145px;
  gap:10px;
}

input{
  width:100%;
  padding:14px 15px;
  border:1.5px solid #f1cede;
  border-radius:14px;
  background:#fffafd;
  color:#654455;
  font-size:16px;
  outline:none;
}

.add{
  border:0;
  border-radius:14px;
  color:white;
  font-size:16px;
  font-weight:800;
  background:linear-gradient(135deg,#ff7ead,#ef8fc6 55%,#ad91f5);
}

.tip{
  margin-top:10px;
  font-size:12px;
  color:#aa8195;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}

.stat{
  padding:15px;
  border-radius:18px;
  text-align:center;
}

.stat:nth-child(1){background:#ffe0ed}
.stat:nth-child(2){background:#ffe8f6}
.stat:nth-child(3){background:#eee6ff}

.stat span{
  display:block;
  font-size:12px;
  opacity:.65;
}

.stat strong{
  font-size:21px;
}

.buyer-card{
  margin-bottom:11px;
  border:1px solid #f1d7e3;
  border-radius:18px;
  background:white;
  overflow:hidden;
}

.buyer-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  padding:14px;
  border:0;
  background:linear-gradient(135deg,#fff4f8,#fbf2ff);
}

.buyer-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ffb4cf,#c9b1ff);
}

.buyer-name{
  font-weight:800;
  font-size:16px;
}

.buyer-total{
  font-size:12px;
  color:#aa8094;
}

.header-right{
  display:flex;
  align-items:center;
  gap:6px;
}

.move-btn{
  width:34px;
  height:34px;
  padding:0;
  border:0;
  border-radius:10px;
  background:#f6e6ee;
  color:#b45f84;
  font-size:17px;
  font-weight:800;
}

.arrow{
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;
  background:#f5edf2;
  color:#8d6b7b;
  font-size:18px;
}

.buyer-detail{
  display:none;
  padding:12px 14px 14px;
}

.buyer-card.open .buyer-detail{
  display:block;
}

.item-row{
  display:grid;
  grid-template-columns:1fr 90px 70px;
  gap:8px;
  align-items:center;
  padding:9px 4px;
  border-bottom:1px solid #f6e9ef;
}

.qty{
  padding:9px;
  text-align:center;
}

.item-delete{
  padding:9px;
  border:0;
  border-radius:10px;
  background:#ffe6ef;
  color:#cf5f82;
  font-weight:800;
}

.buyer-delete{
  margin-top:10px;
  padding:10px 12px;
  border:0;
  border-radius:11px;
  background:#f2edf0;
  color:#9d7889;
  font-weight:700;
}

.empty{
  padding:36px;
  text-align:center;
  color:#b18a9d;
}

.reset{
  padding:11px 14px;
  border:0;
  border-radius:12px;
  background:#f3eaf0;
  color:#a1778b;
  font-weight:700;
}

@media(max-width:760px){
  .form{
    grid-template-columns:1fr 1fr;
  }

  .add{
    grid-column:1/-1;
    min-height:48px;
  }

  .item-row{
    grid-template-columns:1fr 75px 62px;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="hero">
  <h1>🎀 은별이방 쿠폰 기록</h1>
  <p>구매자를 누르면 구매한 쿠폰을 확인할 수 있어요 ♡</p>
</div>

<div class="card">

  <div class="form">

    <input id="buyer" placeholder="구매한 이름">

    <input id="product" placeholder="구매한 항목">

    <input
      id="count"
      type="number"
      min="1"
      value="1"
      placeholder="개수">

    <button id="addButton" class="add">
      ＋ 기록 추가
    </button>

  </div>

  <div class="tip">
    같은 구매자 + 같은 항목을 추가하면 자동 합산돼요.
  </div>

</div>

<div class="stats">

  <div class="stat">
    <span>구매자</span>
    <strong id="peopleCount">0명</strong>
  </div>

  <div class="stat">
    <span>쿠폰 항목</span>
    <strong id="itemCount">0개</strong>
  </div>

  <div class="stat">
    <span>전체 수량</span>
    <strong id="totalCount">0개</strong>
  </div>

</div>

<div class="card">

  <b>🩷 구매자별 쿠폰 기록</b>

  <div id="buyerList" style="margin-top:13px"></div>

</div>

<button id="resetButton" class="reset">
  전체 기록 삭제
</button>

</div>

<script>

var records = {
  items: [],
  people: {},
  order: []
};

try {
  var saved = localStorage.getItem("buyerTracker");

  if(saved) {
    var loaded = JSON.parse(saved);

    records.items = loaded.items || [];
    records.people = loaded.people || {};
    records.order = loaded.order || Object.keys(records.people);
  }
} catch(e) {}

function save(){
  localStorage.setItem(
    "buyerTracker",
    JSON.stringify(records)
  );
}

function addRecord(){

  var buyer =
    document.getElementById("buyer").value.trim();

  var product =
    document.getElementById("product").value.trim();

  var count =
    parseInt(document.getElementById("count").value);

  if(!buyer){
    alert("구매한 이름을 입력해주세요.");
    return;
  }

  if(!product){
    alert("구매한 항목을 입력해주세요.");
    return;
  }

  if(!count || count < 1){
    alert("개수를 입력해주세요.");
    return;
  }

  if(records.items.indexOf(product) === -1){
    records.items.push(product);
  }

  if(!records.people[buyer]){
    records.people[buyer] = {};
    records.order.push(buyer);
  }

  if(!records.people[buyer][product]){
    records.people[buyer][product] = 0;
  }

  records.people[buyer][product] += count;

  save();

  document.getElementById("buyer").value = "";
  document.getElementById("product").value = "";
  document.getElementById("count").value = "1";

  drawBuyers();
}

function moveBuyer(buyer, direction){

  var index = records.order.indexOf(buyer);

  if(index === -1) return;

  var newIndex = index + direction;

  if(newIndex < 0 || newIndex >= records.order.length){
    return;
  }

  var temp = records.order[index];

  records.order[index] = records.order[newIndex];
  records.order[newIndex] = temp;

  save();
  drawBuyers();
}

function changeQty(buyer, product, value){

  var number = parseInt(value);

  if(isNaN(number) || number < 0){
    number = 0;
  }

  if(number === 0){
    delete records.people[buyer][product];
  }else{
    records.people[buyer][product] = number;
  }

  save();
  drawBuyers();
}

function deleteItem(buyer, product){

  if(confirm(product + " 항목을 삭제할까요?")){

    delete records.people[buyer][product];

    save();
    drawBuyers();
  }
}

function deleteBuyer(buyer){

  if(confirm(buyer + "님의 모든 기록을 삭제할까요?")){

    delete records.people[buyer];

    records.order =
      records.order.filter(function(name){
        return name !== buyer;
      });

    save();
    drawBuyers();
  }
}

function updateStats(){

  var buyers = Object.keys(records.people);

  document.getElementById("peopleCount").textContent =
    buyers.length + "명";

  var usedItems = {};
  var total = 0;

  buyers.forEach(function(buyer){

    Object.keys(records.people[buyer]).forEach(function(product){

      usedItems[product] = true;

      total +=
        records.people[buyer][product] || 0;

    });

  });

  document.getElementById("itemCount").textContent =
    Object.keys(usedItems).length + "개";

  document.getElementById("totalCount").textContent =
    total + "개";
}

function drawBuyers(){

  var list =
    document.getElementById("buyerList");

  records.order =
    records.order.filter(function(name){
      return records.people[name];
    });

  Object.keys(records.people).forEach(function(name){

    if(records.order.indexOf(name) === -1){
      records.order.push(name);
    }

  });

  save();
  updateStats();

  if(records.order.length === 0){

    list.innerHTML =
      '<div class="empty">' +
      '🎀 아직 쿠폰 기록이 없어요.' +
      '</div>';

    return;
  }

  list.innerHTML = "";

  records.order.forEach(function(buyer, index){

    var buyerData = records.people[buyer];

    var products = Object.keys(buyerData);

    var total = 0;

    products.forEach(function(product){
      total += buyerData[product] || 0;
    });

    var card =
      document.createElement("div");

    card.className = "buyer-card";

    var header =
      document.createElement("div");

    header.className = "buyer-header";

    var left =
      document.createElement("div");

    left.className = "buyer-left";

    left.innerHTML =
      '<div class="avatar">🎀</div>' +
      '<div>' +
        '<div class="buyer-name">' + buyer + '</div>' +
        '<div class="buyer-total">총 ' + total + '개</div>' +
      '</div>';

    left.onclick = function(){
      card.classList.toggle("open");
    };

    var right =
      document.createElement("div");

    right.className = "header-right";

    var up =
      document.createElement("button");

    up.className = "move-btn";
    up.textContent = "↑";

    up.onclick = function(e){
      e.stopPropagation();
      moveBuyer(buyer, -1);
    };

    var down =
      document.createElement("button");

    down.className = "move-btn";
    down.textContent = "↓";

    down.onclick = function(e){
      e.stopPropagation();
      moveBuyer(buyer, 1);
    };

    var arrow =
      document.createElement("button");

    arrow.className = "arrow";
    arrow.textContent = "⌄";

    arrow.onclick = function(){
      card.classList.toggle("open");
    };

    right.appendChild(up);
    right.appendChild(down);
    right.appendChild(arrow);

    header.appendChild(left);
    header.appendChild(right);

    var detail =
      document.createElement("div");

    detail.className = "buyer-detail";

    products.forEach(function(product){

      var row =
        document.createElement("div");

      row.className = "item-row";

      var name =
        document.createElement("div");

      name.textContent = product;

      var input =
        document.createElement("input");

      input.type = "number";
      input.min = "0";
      input.className = "qty";
      input.value = buyerData[product];

      input.onchange = function(){
        changeQty(
          buyer,
          product,
          this.value
        );
      };

      var del =
        document.createElement("button");

      del.className = "item-delete";
      del.textContent = "삭제";

      del.onclick = function(){
        deleteItem(buyer, product);
      };

      row.appendChild(name);
      row.appendChild(input);
      row.appendChild(del);

      detail.appendChild(row);

    });

    var deleteButton =
      document.createElement("button");

    deleteButton.className = "buyer-delete";
    deleteButton.textContent = "구매자 전체 삭제";

    deleteButton.onclick = function(){
      deleteBuyer(buyer);
    };

    detail.appendChild(deleteButton);

    card.appendChild(header);
    card.appendChild(detail);

    list.appendChild(card);

  });
}

document.getElementById("addButton").onclick =
  addRecord;

document.getElementById("resetButton").onclick =
function(){

  if(confirm("모든 쿠폰 기록을 삭제할까요?")){

    records = {
      items: [],
      people: {},
      order: []
    };

    save();
    drawBuyers();
  }
};

drawBuyers();

</script>

</body>
</html>
